<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Daily — Technical SEO Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f1ea; --card:#fffdf8; --ink:#1c1b19; --muted:#6b675e; --line:#e2ddd1;
  --accent:#1f7a4d; --accent-soft:#e3f1e8; --bad:#b4442c; --bad-soft:#f8e6e0; --gold:#b9852a;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141513; --card:#1c1d1a; --ink:#ece9e1; --muted:#9a968c; --line:#2e2f2b;
  --accent:#4cbf86; --accent-soft:#1d3328; --bad:#e2775e; --bad-soft:#3a221c; --gold:#d9a84a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.narrow{max-width:760px;margin:0 auto}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.news-col{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:1000px){.home-grid{grid-template-columns:1fr}.news-col{position:static;max-height:none}}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.confirm{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--paper)}
.confirm span{margin-right:auto;font-size:14.5px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.brand{font-family:var(--serif);font-weight:700;font-size:28px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.1}
.stat small{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
h1,h2{font-family:var(--serif);letter-spacing:-.015em;margin:0 0 8px}
h1{font-size:30px}h2{font-size:21px}
p{margin:0 0 12px}
.btn{font:600 15px var(--sans);border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:500 14px var(--sans);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.section{margin-top:22px}
.label{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:190px 1fr 56px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .pct{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
@media (max-width:560px){.bar{grid-template-columns:130px 1fr 46px;font-size:12.5px}}
.week{display:flex;gap:6px}
.day{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.day i{display:block;height:34px;border-radius:7px;background:var(--line);margin-bottom:4px;font-style:normal;line-height:34px;color:var(--ink);font-size:12px}
.day i.on{background:var(--accent);color:#fff}
.day i.today{outline:2px solid var(--accent);outline-offset:1px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--accent);transition:width .3s}
.tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.tag.d1{color:var(--accent)}.tag.d2{color:var(--gold)}.tag.d3{color:var(--bad)}
.tag.rev{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.q{font-size:19px;font-weight:500;margin-bottom:18px;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:15px/1.45 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none;margin-top:2px}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--paper);border-left:3px solid var(--accent);font-size:14.5px}
.explain.bad{border-left-color:var(--bad)}
.explain strong{display:block;margin-bottom:4px}
code{font-family:var(--mono);font-size:.88em;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.explain code{background:var(--card)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.big{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1}
.review{display:grid;gap:8px;margin-top:10px}
.rv{display:flex;gap:10px;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rv .m{font-family:var(--mono);font-weight:500;flex:none}
.rv .m.ok{color:var(--accent)}.rv .m.no{color:var(--bad)}
.rank{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.rank b{color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
.news{display:grid;gap:2px}
.ni{display:block;text-decoration:none;color:var(--ink);padding:11px 12px;margin:0 -12px;border-radius:9px}
.ni:hover{background:var(--paper)}
.ni .nd{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ni b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.ni span:last-child{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.board-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.board-tabs button{font:500 13px var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.board-tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lb{display:grid;gap:4px}
.lb-row{display:grid;grid-template-columns:28px 30px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.lb-row.me{background:var(--accent-soft)}
.lb-row .pos{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.lb-row .pos.top{color:var(--gold);font-weight:600}
.lb-row .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.lb-row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .nm small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.lb-row .val{font-family:var(--mono);font-size:14px;font-weight:500}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <div class="brand">SEO<span>Daily</span></div>
    <div class="meta" id="today"></div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ---------- Question bank ----------
   Format: [category, difficulty(1-3), question, correct answer, [wrong answers], explanation]
   IDs are array positions — only ever append new questions to keep progress stable. */
const CATS = {
  crawl:"Crawling & robots.txt", index:"Indexing & canonicals", status:"Status codes & redirects",
  js:"Rendering & JavaScript", cwv:"Core Web Vitals", schema:"Structured data",
  intl:"International & hreflang", sitemap:"XML sitemaps", arch:"Architecture & internal links",
  logs:"Logs & crawl budget", mobile:"Mobile, HTTPS & URLs", gsc:"Search Console", ai:"AI search & bots",
  onpage:"On-page & content", local:"Local & ecommerce"
};
const BANK = [
["crawl",1,"Where must a robots.txt file live for its rules to apply to `https://shop.example.com`?","At `https://shop.example.com/robots.txt` — the root of that exact host and protocol",["Anywhere on the domain, as long as it's linked from the homepage","At `https://example.com/robots.txt` — the root domain covers all subdomains","Inside the XML sitemap"],"robots.txt only applies to the protocol, host and port it's served from. Every subdomain needs its own file at its root."],
["crawl",1,"A URL is disallowed in robots.txt. Can it still show up in Google's index?","Yes — if it's linked from elsewhere, Google can index the URL without crawling its content",["No, disallowed URLs are always removed from the index","Only if it has a noindex tag","Only on Bing, never on Google"],"Disallow controls crawling, not indexing. A blocked URL with external links can be indexed with no snippet ('No information is available for this page')."],
["crawl",2,"You want a page out of Google's index for good. What's the reliable method?","Let Google crawl it and serve a `noindex` robots meta tag or `X-Robots-Tag` header",["Add `Disallow:` for it in robots.txt","Add `Noindex:` for it in robots.txt","Add `rel=\"nofollow\"` to every internal link pointing to it"],"Google has to crawl the page to see noindex. Blocking it in robots.txt hides the noindex. Google stopped supporting `Noindex:` in robots.txt in 2019."],
["crawl",1,"How does Googlebot treat a `Crawl-delay` line in robots.txt?","It ignores it",["It waits that many seconds between requests","It waits that many milliseconds between requests","It applies it to images only"],"Google doesn't support crawl-delay. Googlebot adjusts its crawl rate automatically based on how your server responds. Some other crawlers, such as Bingbot, do respect it."],
["crawl",2,"robots.txt has `Disallow: /shop/` and `Allow: /shop/sale/`. Can Googlebot crawl `/shop/sale/shoes`?","Yes — the most specific (longest) matching rule wins",["No — Disallow always beats Allow","No — the first rule in the file wins","Only if the sitemap lists it"],"Google uses the longest matching path. If two matching rules are the same length, the less restrictive one (Allow) wins."],
["crawl",2,"What happens when a site's robots.txt returns a 404?","Google assumes there are no crawl restrictions",["Google stops crawling the whole site","Google treats every URL as disallowed","Google drops the site from the index"],"Most 4xx responses for robots.txt are treated as 'no robots.txt'. 5xx responses are a different story."],
["crawl",2,"After a site release, Search Console shows crawling suddenly dropping and a robots.txt fetch problem. What should you check first?","Whether `/robots.txt` loads properly — if it returns a server error, Google pauses crawling",["Whether the XML sitemap has new URLs","Whether the homepage title changed","Whether Google Analytics is still tracking"],"If Google can't fetch robots.txt because of a server error, it plays safe and stops crawling. Open `yoursite.com/robots.txt` after every big release, and check the robots.txt report under Settings in Search Console."],
["crawl",2,"You want to stop Google crawling internal site-search pages like `/search?q=shoes`. What's the simplest robots.txt rule?","`Disallow: /search`",["`Noindex: /search`","`Disallow: shoes`","`Block: /search?q=`"],"Disallow rules match the start of the URL path, so `/search` covers every internal search URL. Just check it doesn't also catch real pages, like `/search-tips`."],
["crawl",1,"What's the quickest way to check whether Google is allowed to crawl and index a specific page?","Search Console's URL Inspection tool",["Search for the page's title in Google","Run the page through PageSpeed Insights","Read the page's meta description"],"URL Inspection shows whether crawling and indexing are allowed, the last crawl date and the canonical Google chose. It's the best first check when a page isn't showing up."],
["crawl",2,"Are robots.txt path rules case-sensitive?","Yes — `Disallow: /Admin/` doesn't block `/admin/`",["No, paths are matched case-insensitively","Only the user-agent line is case-sensitive","Only on Windows servers"],"Paths in Allow and Disallow rules are case-sensitive. User-agent names are not."],
["ai",2,"What does the `Google-Extended` user-agent token in robots.txt control?","Whether your content can be used to train and ground Gemini models. It doesn't affect Google Search ranking or inclusion",["Whether your pages appear in Google Search","Whether Googlebot renders JavaScript","How often Googlebot-Image crawls"],"Google-Extended is a control token, not a separate crawler. Blocking it doesn't remove you from Search, and AI Overviews are governed by Search's own controls."],
["index",1,"What is `rel=\"canonical\"` to Google?","A strong hint, which Google can override",["A directive Google always obeys","A redirect","A ranking factor that boosts the canonical page"],"Google weighs canonical tags alongside redirects, internal links, sitemaps and content similarity. Conflicting signals can lead it to choose a different canonical."],
["index",2,"Page A has `rel=canonical` pointing to page B, and page B is `noindex`. What's the problem?","Mixed signals: the canonical target should be an indexable 200 page",["Nothing — this is the recommended way to hide duplicates","Page A gets a manual action","Google indexes both pages"],"A canonical says 'index B instead', while noindex on B says 'don't index B'. Point canonicals at indexable, 200-status URLs."],
["index",1,"Why do most SEOs add a self-referencing canonical to every indexable page?","It consolidates parameter, tracking and case variants back to the clean URL",["It's required for a page to be indexed","It doubles the PageRank the page receives","It stops scrapers from copying the page"],"URLs like `?utm_source=` or `?ref=` create duplicates. A self-canonical tells Google which version you prefer."],
["index",2,"How can you set a canonical for a PDF file?","With an HTTP `Link: <url>; rel=\"canonical\"` response header",["With a `<link rel=canonical>` tag inside the PDF","You can't — PDFs can't be canonicalized","Through robots.txt"],"Non-HTML files can't carry HTML tags, so you send the canonical, and directives such as `X-Robots-Tag: noindex`, as HTTP headers."],
["index",1,"Which header lets you noindex a PDF or an image file?","`X-Robots-Tag: noindex`",["`Cache-Control: noindex`","`Link: noindex`","`Content-Type: noindex`"],"X-Robots-Tag supports the same directives as the robots meta tag, sent in the HTTP response."],
["gsc",2,"What does 'Crawled – currently not indexed' in Search Console usually mean?","Google fetched the page but chose not to index it, often because of quality or duplication",["robots.txt blocked the page","The server returned 5xx","The page has a manual action"],"It's Google's choice, not a technical block. Improve uniqueness and value, internal links and consolidation."],
["gsc",2,"What does 'Discovered – currently not indexed' mean?","Google knows the URL but hasn't crawled it yet, often because of crawl capacity or low perceived priority",["Google crawled the page and rejected it","The page is noindex","The page redirects"],"Google found the URL in links or sitemaps but put off crawling it. On large sites this often points to crawl budget or server capacity limits."],
["gsc",2,"'Duplicate, Google chose different canonical than user' means:","Google ignored your declared canonical and chose another URL",["Your canonical tag is malformed","You have two canonical tags","The page has a hreflang error"],"Your signals conflict, for example internal links or the sitemap pointing at the other version. Align your signals so they back up your canonical."],
["index",1,"How does Google treat `example.com/page#pricing` compared with `example.com/page`?","As the same URL — fragments are generally ignored for indexing",["As two separate pages","As a duplicate content violation","As a redirect"],"Fragments after `#` aren't sent to the server and are ignored for indexing. Don't rely on them for distinct pages."],
["index",3,"Search Console's URL Parameters tool is gone. How should you manage parameter duplication now?","Canonical tags, clean internal linking, and robots.txt rules for crawl-wasting parameters",["Email Google support with a parameter list","Use the Removals tool every month","Add `nofollow` to every page"],"Google retired the tool in 2022, saying its systems can figure out parameters. You control it on your own site."],
["index",2,"What does the `data-nosnippet` HTML attribute do?","Stops a specific section of text from being used in search snippets",["Removes the page from the index","Hides the element from users","Stops Google from following links in that element"],"You can put it on span, div and section elements to exclude that text from snippets. The page stays indexed."],
["index",2,"How long does a Search Console Removals request hide a URL?","About 6 months — it's temporary, so you also need noindex, a 404/410 or a block to make it permanent",["Forever","24 hours","Until the next core update"],"Removals is an emergency hide. Without a permanent signal, the URL can come back once the request expires."],
["index",1,"Last year's Black Friday page still ranks, but the offer has ended. What's usually the best move?","Keep the URL and update it for the next sale, so it keeps the rankings it built",["Leave it live with the old prices","Delete it and redirect it to the homepage","Add `nofollow` to the page"],"Reusing one evergreen URL for a recurring promo, like `/black-friday`, keeps its links and history. Redirecting to the homepage is often treated as a soft 404."],
["status",1,"Does a 302 redirect pass PageRank?","Yes. Both 301 and 302 pass signals; the difference is which URL Google tends to keep as canonical",["No, only 301s pass PageRank","Only for 30 days","Only if the target is on the same domain"],"A 301 strongly signals that the target should become canonical. A 302 signals a temporary move, so Google tends to keep the source URL. Use the code that matches your intent."],
["status",2,"404 vs 410 — what's the practical difference for Google?","Both remove the URL. 410 may be treated as slightly more definitive, but the difference is minor",["410 gets you a penalty","404 keeps the page indexed forever","410 redirects users to the homepage"],"Both are fine for removed content. Use 410 when you're sure it's gone for good, but don't lose sleep over which you pick."],
["status",1,"What's a 'soft 404'?","A page that returns 200 OK but looks like an error or empty page to users and Google",["A 404 with a pretty design","A 404 that's linked internally","A 301 to a 404 page"],"Examples are 'no results found' pages or thin, empty templates served with a 200. Return a real 404/410, or add content."],
["status",2,"Your site is down for 2 hours of planned maintenance. Which status code should it return?","503 Service Unavailable, ideally with a `Retry-After` header",["404 Not Found","200 with a maintenance message","301 to a maintenance page"],"A 503 tells crawlers the outage is temporary. A 200 maintenance page risks being indexed as soft 404s. Long-running 503s can still lead to deindexing."],
["status",1,"A Screaming Frog crawl shows lots of internal links pointing to URLs that 301 redirect. What should you do?","Update those internal links to point straight to the final URL",["Nothing — internal redirects help SEO","Change the 301s to 302s","Add the redirecting URLs to the sitemap"],"The redirects still work, but linking directly is faster for users and saves crawl effort. Fix the most-linked ones first, like the navigation and footer."],
["status",3,"How many redirect hops will Googlebot follow before giving up?","Up to 10",["Up to 3","Just 1","Unlimited"],"Google follows up to 10 hops. Every hop adds latency and risk, so collapse chains into a single redirect."],
["status",2,"How does Google treat a 308 redirect?","Like a 301 — permanent",["Like a 302 — temporary","As an error","As a soft 404"],"308 is the permanent redirect that preserves the HTTP method. 307 is its temporary counterpart and is treated like a 302."],
["status",1,"You're changing a blog URL from `/blog/seo-tips-2025` to `/blog/seo-tips`. What should you set up?","A 301 redirect from the old URL to the new one, then update internal links",["A 302 redirect, in case it changes again","Nothing — Google finds the new URL on its own","Delete the old page and wait"],"A 301 sends visitors and ranking signals to the new URL. Updating internal links and the sitemap helps Google pick up the change faster."],
["status",2,"Your server starts returning many 429 and 5xx responses to Googlebot. What happens?","Googlebot automatically slows its crawl rate",["Googlebot speeds up to retry faster","Nothing changes","All URLs are deindexed at once"],"Google backs off when your server struggles. If errors persist, URLs can eventually drop out of the index."],
["status",1,"During an HTTP → HTTPS migration, how should redirects work?","301 each HTTP URL to its exact HTTPS equivalent, page to page",["301 every HTTP URL to the HTTPS homepage","302 everything for the first year","No redirects needed — Google figures it out"],"One-to-one redirects keep signals for each page. Redirecting everything to the homepage creates soft 404s."],
["status",2,"A dev proposes redirecting every 404 to the homepage 'to save link equity'. What usually happens?","Google treats those redirects as soft 404s, and users get confused",["Rankings for the homepage go up","It counts as a good 301 strategy","Google treats it as cloaking and bans the site"],"Redirect only to a closely relevant replacement. Otherwise return 404/410."],
["js",1,"What browser engine does Googlebot use to render pages?","An evergreen (regularly updated) version of Chromium",["A frozen Chrome 41","Firefox","No engine — Google only reads raw HTML"],"Google moved to an evergreen Chromium renderer in 2019, so modern JavaScript features are generally supported."],
["js",1,"Which of these links can Google reliably discover and follow?","`<a href=\"/pricing\">Pricing</a>`",["`<span onclick=\"goTo('/pricing')\">Pricing</span>`","`<a onclick=\"goTo('/pricing')\">Pricing</a>` with no href","`<a href=\"javascript:void(0)\">Pricing</a>`"],"Google follows `<a>` elements that have a resolvable URL in `href`. Click handlers alone aren't crawlable links."],
["js",2,"Products only load after a user clicks a 'Load more' button. What's the SEO risk?","Googlebot doesn't click buttons, so those products may never be discovered",["None — Googlebot clicks every button","Google will penalize the button","Only the button text gets indexed"],"Back infinite scroll and load-more patterns with crawlable paginated URLs, such as `?page=2`, using real `<a href>` links."],
["js",3,"The raw HTML has `<meta name=\"robots\" content=\"noindex\">`, and JavaScript removes it after load. What happens?","Google may skip rendering and honor the noindex",["Google renders first, sees no noindex, and indexes the page","Google indexes the page twice","Google flags it as cloaking"],"If Google sees noindex in the initial HTML, it may not render the page at all. Never rely on JS to remove a noindex."],
["js",2,"Why is server-side rendering (SSR) generally safer for SEO than pure client-side rendering?","The full content and links are in the initial HTML response, so crawlers that don't execute JS still see them",["Google ranks SSR pages higher by default","SSR pages don't need internal links","CSR is banned by Google"],"Google can render JS, but rendering can be delayed, and many other crawlers, including most AI crawlers, don't execute JavaScript."],
["js",3,"What is Google's current stance on dynamic rendering (serving pre-rendered HTML to bots)?","It's a workaround, not a recommended long-term solution. Use SSR, static rendering or hydration instead",["It's the recommended best practice","It's cloaking and gets penalized","It's required for React sites"],"Google's docs call dynamic rendering a workaround. It isn't cloaking if the content is equivalent, but it adds complexity."],
["js",1,"Should you block your JS and CSS files in robots.txt?","No — Google needs them to render the page properly",["Yes, it saves crawl budget with no downside","Yes, but only the CSS","Only on mobile"],"Blocking rendering resources can make Google see a broken or empty page."],
["js",2,"An SPA uses hash routing such as `/#/products/shoes`. What's the SEO problem?","Google ignores fragments, so all routes collapse to one URL. Use History API routes such as `/products/shoes`",["None — hash URLs are ideal","Hashes double crawl budget","Google treats hashes as subdomains"],"Each view needs its own real, crawlable URL."],
["gsc",1,"How can you see the HTML Google rendered for a page?","Search Console's URL Inspection tool → Test live URL → View tested page",["View source in your browser","Google Analytics","The robots.txt report"],"The tested page shows the rendered HTML, a screenshot and any resource-loading errors, so you see what Google sees."],
["cwv",2,"Should you lazy-load the main hero image, which is the LCP element?","No — lazy-loading the LCP image delays it. Load it eagerly, ideally with `fetchpriority=\"high\"`",["Yes, always lazy-load every image","Yes, but only on mobile","It makes no difference"],"Lazy-load below-the-fold images. The LCP image should be discoverable early in the HTML and prioritized."],
["cwv",1,"What are the three Core Web Vitals?","LCP, INP, CLS",["LCP, FID, CLS","TTFB, FCP, CLS","LCP, INP, TTFB"],"INP (Interaction to Next Paint) replaced FID as a Core Web Vital in March 2024."],
["cwv",1,"What's the 'good' threshold for Largest Contentful Paint (LCP)?","2.5 seconds or less",["1 second or less","4 seconds or less","200 ms or less"],"Good is ≤2.5 s, needs improvement is up to 4 s, and poor is anything above 4 s."],
["cwv",1,"What's the 'good' threshold for Interaction to Next Paint (INP)?","200 ms or less",["100 ms or less","500 ms or less","2.5 seconds or less"],"Good is ≤200 ms, needs improvement is up to 500 ms, and poor is anything above 500 ms."],
["cwv",1,"What's the 'good' threshold for Cumulative Layout Shift (CLS)?","0.1 or less",["0.25 or less","1.0 or less","100 ms or less"],"CLS is a unitless score. Good is ≤0.1 and poor is anything above 0.25."],
["cwv",3,"At what percentile is a page assessed for passing Core Web Vitals?","The 75th percentile of real-user page loads, split by mobile and desktop",["The median (50th)","The 95th percentile","The average of lab tests"],"If 75% of visits meet the 'good' threshold, the metric passes. This is field data from CrUX."],
["cwv",2,"What's the difference between CrUX and Lighthouse data?","CrUX is field data from real Chrome users, and Lighthouse is lab data from a simulated test",["They're identical","CrUX is lab data and Lighthouse is field data","Lighthouse is what Google uses for ranking"],"Google's page experience assessment uses field data. Lab tools are for debugging."],
["cwv",1,"Which of these commonly causes high CLS?","Images and ads without reserved dimensions (no width and height or aspect-ratio)",["A slow server response","Too many internal links","Using HTTPS"],"Reserve space for images, embeds, ads and banners. Late-loading web fonts can also shift text."],
["cwv",2,"What does INP measure?","The latency of user interactions (clicks, taps, key presses) across the whole visit, reporting roughly the worst one",["Only the first interaction","The time to the first byte","How long the page takes to load fully"],"Unlike FID, which only measured the first input's delay, INP covers interactions across the whole page lifecycle."],
["cwv",1,"Where can you see whether real visitors get good Core Web Vitals across your whole site?","Search Console's Core Web Vitals report",["Search Console's Links report","Google Ads","The robots.txt report"],"It groups URLs as Good, Needs improvement or Poor using real Chrome user data. Use PageSpeed Insights to dig into a single page."],
["cwv",2,"What's a 'long task' in performance terms?","Main-thread work longer than 50 ms, which delays the response to interactions",["Any request over 1 MB","A page with over 3,000 words","A redirect chain"],"Breaking up long tasks, for example by yielding to the main thread, is a key INP fix."],
["cwv",2,"PageSpeed Insights flags 'Properly size images' and 'Serve images in next-gen formats' on a product page. What's the practical fix?","Compress and resize the images, and serve formats like WebP or AVIF",["Remove all images from the page","Lazy-load the main product image","Turn off HTTPS"],"Oversized images are one of the most common causes of slow loading. Most CMSs and image CDNs can resize and convert images automatically."],
["cwv",1,"A banner appears at the top of the page after a second and pushes everything down. Which metric does this hurt?","CLS (Cumulative Layout Shift)",["LCP (Largest Contentful Paint)","INP (Interaction to Next Paint)","TTFB (Time to First Byte)"],"Content jumping around after it appears is a layout shift. Reserve space for banners, cookie notices and ads, or overlay them instead."],
["schema",1,"Which structured data format does Google recommend?","JSON-LD",["Microdata","RDFa","Open Graph"],"Google supports all three structured data formats but recommends JSON-LD because it's the easiest to implement and maintain. Open Graph isn't schema.org markup."],
["schema",1,"Does valid structured data guarantee rich results?","No — it makes a page eligible, and Google decides whether to show them",["Yes, within 24 hours","Yes, if the Rich Results Test passes","Only for Product markup"],"Eligibility isn't a guarantee. Quality, relevance and policy compliance all matter."],
["schema",2,"Which sites can still get FAQ rich results in Google?","Only well-known, authoritative government and health sites",["Every site with valid FAQPage markup","Only e-commerce sites","No sites — FAQPage is invalid schema"],"Google restricted FAQ rich results in August 2023. The markup is still valid schema.org; it just won't show for most sites."],
["schema",2,"What's the status of HowTo rich results?","Deprecated — Google no longer shows them",["Shown on desktop and mobile","Shown on mobile only","Required for recipe sites"],"Google deprecated HowTo rich results in 2023."],
["schema",1,"Which tool checks whether a page is eligible for Google rich results?","Google's Rich Results Test",["PageSpeed Insights","The robots.txt report","Google Tag Manager"],"The Schema Markup Validator checks general schema.org validity, while the Rich Results Test checks Google-specific eligibility."],
["schema",2,"You add Review markup to content that isn't visible on the page. What's the risk?","It violates Google's guidelines and can lead to a structured data manual action",["None — hidden markup is fine","A slight ranking boost","The page gets AMP status"],"Markup must describe content that users can see on the page."],
["schema",3,"Can a business show star ratings from reviews about itself (self-serving) using LocalBusiness or Organization markup?","No — self-serving reviews on LocalBusiness and Organization aren't eligible for review stars",["Yes, always","Yes, if there are more than 50 reviews","Only with microdata"],"Google stopped showing self-serving review snippets for these types in 2019."],
["schema",2,"Which schema.org property links an entity to its official profiles, such as LinkedIn or Wikipedia?","`sameAs`",["`url`","`relatedLink`","`hasPart`"],"`sameAs` helps search engines tie your entity to its other authoritative representations."],
["schema",1,"Which structured data type can help show price, stock and review stars for an ecommerce page in Google?","`Product` (with offer and review details)",["`Article`","`BreadcrumbList`","`FAQPage`"],"Product markup makes product pages eligible for rich results. Keep the price and stock in the markup matching what's visible on the page."],
["schema",2,"In Article markup, what format should `datePublished` use?","ISO 8601, ideally with a timezone, e.g. `2026-03-14T09:00:00+00:00`",["`14/03/2026`","`March 14th, 2026`","A Unix timestamp"],"ISO 8601 with a timezone avoids any ambiguity about the date."],
["intl",1,"Which hreflang value is invalid?","`en-UK`",["`en-GB`","`es-419`","`fr`"],"The region code for the United Kingdom is `GB` (ISO 3166-1 alpha-2). `es-419` (Latin America) is a valid UN M.49 region."],
["intl",1,"What is `hreflang=\"x-default\"` for?","The fallback page for users whose language or region doesn't match any listed version",["The default canonical","The English version","The mobile version"],"x-default is typically a language selector or global homepage."],
["intl",2,"Page A (en) lists page B (de) in hreflang, but page B doesn't list page A. What happens?","Google may ignore the annotation — hreflang needs return links",["It works fine one-way","Google penalizes page B","Page B gets redirected"],"Each page must link to every alternate, and the alternates must link back."],
["intl",2,"Should each page include a hreflang tag pointing to itself?","Yes — the set should be self-referencing",["No, that creates a loop","Only the x-default page","Only if it's English"],"Every page in the cluster lists all versions, including itself."],
["intl",2,"Which of these is NOT a supported way to implement hreflang?","robots.txt",["HTML `<link>` tags in the head","HTTP headers","An XML sitemap"],"Pick one of the three supported methods. Mixing methods raises the risk of conflicts."],
["intl",3,"Your /fr/ page canonicalizes to the /en/ page while also having hreflang. What's wrong?","Each language version should self-canonicalize. Cross-language canonicals tell Google to drop the French page",["Nothing, that's correct","hreflang overrides the canonical anyway","You need a 301 as well"],"Canonicals across languages conflict with hreflang. Translated pages aren't duplicates."],
["intl",3,"Can you use a region-only hreflang value such as `hreflang=\"us\"`?","No — the language code is required; region is optional",["Yes, region-only works","Only for English-speaking countries","Only in sitemaps"],"Use the format `language` or `language-REGION`, e.g. `en-US`. Region alone isn't valid."],
["intl",2,"Why is auto-redirecting visitors by IP location risky for SEO?","Googlebot mostly crawls from US IPs and may never see the other versions",["Google bans geo-redirects","It increases CLS","It breaks HTTPS"],"Let users choose with a banner or selector, and keep every version crawlable."],
["intl",2,"Which domain setup sends the strongest geotargeting signal?","A country-code TLD such as `.de` or `.fr`",["A subfolder like `/de/`","A URL parameter like `?lang=de`","A subdomain on a .com"],"ccTLDs are inherently tied to a country. Search Console's International Targeting report has been retired."],
["sitemap",1,"What are the limits for a single XML sitemap file?","50,000 URLs or 50 MB uncompressed, whichever comes first",["10,000 URLs or 10 MB","1,000 URLs","No limits"],"Split larger sets across multiple sitemaps tied together by a sitemap index."],
["sitemap",2,"Which sitemap fields does Google use?","`<lastmod>`, if it's consistently accurate. Google ignores `<priority>` and `<changefreq>`",["All three equally","Only `<priority>`","None of them"],"Only update lastmod when content meaningfully changes. Faking it destroys its value as a signal."],
["sitemap",1,"Which URLs belong in an XML sitemap?","Canonical, indexable URLs that return 200",["Every URL including redirects and 404s","Only the homepage","noindexed pages, so Google can find the noindex"],"A sitemap is a list of pages you want indexed. Including junk weakens its value as a signal."],
["sitemap",2,"How do you reference a sitemap in robots.txt?","`Sitemap: https://example.com/sitemap.xml` — a full absolute URL, anywhere in the file",["`Sitemap: /sitemap.xml` inside a user-agent group only","`Allow: sitemap.xml`","You can't — it must be submitted in Search Console"],"The Sitemap line is independent of user-agent groups and must be an absolute URL."],
["sitemap",1,"You've just launched a new section of the site. What's the simplest way to help Google find the new pages?","Add them to the XML sitemap and link to them from existing pages",["Wait — Google will find them eventually","Email Google support","Add an `index` meta tag to every page"],"Sitemaps help discovery, but links from pages Google already crawls are often what gets new pages found quickly."],
["sitemap",2,"Which search engines support IndexNow?","Bing, Yandex and others — but not Google",["Google only","All engines including Google","No one — it's deprecated"],"IndexNow lets you push URL changes instantly to participating engines. Google hasn't adopted it."],
["sitemap",2,"Search Console's Sitemaps report says 'Couldn't fetch' for your sitemap. What should you check first?","That the sitemap URL loads in a browser and returns valid XML",["That every page has a meta description","That the sitemap lists your social profiles","That the sitemap is under 1 KB"],"Typos in the submitted URL, a robots.txt block or a server error are the usual causes. Fix it, then resubmit in Search Console."],
["arch",1,"What's an orphan page?","A page with no internal links pointing to it",["A page with no outbound links","A page without a canonical","A page that returns 404"],"Orphans are hard for crawlers and users to find. A sitemap can surface them, but internal links matter more."],
["arch",2,"Does adding `nofollow` to internal links 'sculpt' PageRank toward important pages?","No — the PageRank on those links is lost rather than redistributed, so it's not a useful tactic",["Yes, it's best practice","Yes, but only on the homepage","Only for footer links"],"Google changed how nofollow PageRank flows years ago. Fix architecture instead: link more to what matters."],
["arch",2,"What's the biggest technical SEO risk of faceted navigation (filters)?","A near-infinite set of crawlable filter combinations that waste crawl budget and create duplicates",["Filters slow down LCP","Filters can't be indexed at all","Google penalizes e-commerce filters"],"Decide which facets deserve indexable pages. Keep the rest out of crawl paths with robots.txt rules and non-crawlable links, plus canonicals."],
["arch",2,"How does Google use `rel=\"next\"` and `rel=\"prev\"` for pagination today?","It doesn't — Google stopped using them as an indexing signal years ago",["As the main pagination signal","To merge all pages into page 1","Only for blogs"],"Give paginated pages self-referencing canonicals and crawlable links between them."],
["arch",2,"Should page 2 of a category canonicalize to page 1?","No — each paginated page should self-canonicalize, or products deeper in the list may not be found",["Yes, always","Only if page 2 has fewer than 10 items","Only on mobile"],"Canonicalizing page 2 to page 1 tells Google page 2's unique content (its product links) doesn't matter."],
["arch",1,"What's 'click depth'?","The number of clicks needed to reach a page from the homepage",["How many times users click a result","Time on page","The number of outbound links"],"Important pages should be shallow, typically within about 3 clicks. Deep pages get crawled and valued less."],
["arch",3,"An event calendar has 'next month' links that go on forever. What's this called?","A crawl trap, or infinite space",["A link wheel","Cloaking","A doorway page"],"Crawlers can follow endless generated URLs. Limit the range or make those links non-crawlable."],
["arch",1,"Why does descriptive internal anchor text matter?","It tells users and search engines what the target page is about",["It's purely decorative","It increases CLS","Google ignores internal anchors"],"'Technical SEO audit checklist' beats 'click here' for both relevance and accessibility."],
["logs",2,"What two things make up Google's crawl budget?","Crawl capacity limit and crawl demand",["Page count and domain age","Backlinks and bounce rate","Sitemap size and robots.txt size"],"Capacity is how much your server can take without strain. Demand is how much Google wants to crawl, based on popularity and freshness."],
["logs",2,"Which sites usually need to worry about crawl budget?","Very large sites (roughly 1M+ pages) or fast-changing ones (10k+ pages changing daily)",["Every site with over 100 pages","Only new sites","Only sites on shared hosting"],"For most small sites, Google crawls everything it needs. Crawl budget is a large-site problem."],
["logs",2,"An audit finds 3,000 orphan pages (no internal links) that are only listed in the sitemap. What's the usual fix?","Link to the ones worth keeping from relevant pages, and remove or redirect the rest",["Leave them — the sitemap is enough","Noindex the whole site","Add all of them to the main menu"],"Pages that only exist in a sitemap tend to get crawled less and rank poorly. Audits are a good time to merge or prune thin orphans."],
["logs",1,"What can server log analysis tell you that a crawler tool like Screaming Frog can't?","What search engine bots actually crawled, how often, and which status codes they got",["Your rankings","Your competitors' traffic","Keyword search volume"],"A site crawler simulates a crawl. Logs show what Googlebot really did."],
["logs",1,"Where is the Crawl Stats report in Search Console?","Settings → Crawl stats",["Performance → Crawl","URL Inspection","Links report"],"It shows requests over time, response codes, file types, host status and Googlebot type."],
["logs",2,"Does `noindex` save crawl budget?","Not really — Google still has to crawl a page to see its noindex",["Yes, noindexed pages are never crawled","Yes, it halves crawling","Only with nofollow"],"To stop crawling, use robots.txt. noindex controls indexing, not crawling, although Google may crawl long-noindexed pages less often."],
["logs",2,"Which of these wastes the most crawl budget on a large site?","Endless parameter URLs, redirect chains and soft 404s",["Having a sitemap","Using HTTPS","Self-referencing canonicals"],"Every unnecessary fetch uses crawl capacity that could go to valuable pages."],
["mobile",1,"Under mobile-first indexing, a block of content exists on desktop but is removed from the mobile HTML. What happens?","It likely won't be indexed — Google indexes the mobile version",["It's indexed from desktop anyway","It ranks higher on desktop only","Google merges both versions"],"Keep content parity between mobile and desktop."],
["mobile",2,"Is content inside tabs or accordions on mobile indexed with full weight?","Yes — in mobile-first indexing, content hidden for UX reasons is treated normally",["No, hidden content is ignored","It gets half weight","Only if it's open by default"],"Hiding content in tabs or accordions to save mobile screen space is fine."],
["mobile",1,"On phones, your site shows the full desktop layout shrunk down, and visitors have to pinch to zoom. What's usually missing?","A responsive design with a viewport meta tag",["An XML sitemap","A canonical tag","Structured data"],"Without `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">`, phones render the desktop layout zoomed out. Responsive design is Google's recommended mobile setup."],
["mobile",1,"Chrome shows 'Not secure' next to your site's address. What's the usual cause?","The page loads over HTTP rather than HTTPS, or the SSL certificate has a problem",["The site has no XML sitemap","The page is missing a meta description","The site has too many redirects"],"HTTPS is a small ranking signal and a big trust signal. Check the certificate hasn't expired and that every HTTP URL 301s to HTTPS."],
["mobile",2,"Are `example.com/page` and `example.com/page/` the same URL to Google?","No — they're separate URLs (apart from the root `example.com/`)",["Yes, always","Only on HTTPS","Only if a sitemap lists both"],"Pick one format, redirect the other, and link consistently."],
["mobile",2,"Are URL paths case-sensitive?","Yes — `/Shoes` and `/shoes` are different URLs",["No, never","Only the domain is","Only on Linux servers, and Google normalizes them"],"Domains are case-insensitive, but paths and parameters are case-sensitive. Normalize to lowercase and redirect."],
["mobile",1,"What's 'mixed content'?","An HTTPS page that loads resources such as images or scripts over HTTP",["Content in two languages","A mix of text and video","Duplicate content across domains"],"Browsers block or warn on mixed content. Update every resource URL to HTTPS."],
["mobile",2,"What does the HSTS header do?","Tells browsers to always connect over HTTPS for that domain",["Speeds up DNS","Sets the canonical","Blocks bots"],"`Strict-Transport-Security` prevents protocol downgrade attacks and skips the HTTP → HTTPS redirect hop for returning visitors."],
["mobile",1,"Which is the most SEO-friendly URL for a product page?","`/mens-running-shoes/nike-pegasus-41`",["`/p?id=83749&cat=12`","`/Mens_Running_Shoes/NIKE-Pegasus-41/`","`/products/item/view/83749/default.aspx?ref=nav`"],"Short, lowercase, readable URLs with hyphens are easiest for people and search engines. Don't change URLs that already rank unless you redirect them."],
["mobile",2,"Does Google index images set as CSS `background-image` in Google Images?","No — use `<img>` elements with alt text for images you want indexed",["Yes, the same as `<img>`","Only PNGs","Only if they're in the sitemap"],"Google Images indexes `<img>` src (including srcset). Background images aren't picked up as image content."],
["gsc",2,"How is 'Average position' calculated in the Performance report?","The average of your site's topmost position each time it appeared",["The median of all rankings","The average of every URL's position, including lower ones","Your position on page 1 only"],"If your site appears at positions 3 and 7 for one query, that impression counts as position 3."],
["gsc",1,"How much historical data does the Performance report keep?","16 months",["Forever","90 days","5 years"],"Export your data regularly, or use the BigQuery bulk export, if you need a longer history."],
["gsc",1,"What does a Domain property in Search Console cover that a URL-prefix property doesn't?","Every protocol and subdomain (http, https, www, m., etc.) — it requires DNS verification",["Only the homepage","Competitors' sites","Paid search data"],"URL-prefix properties cover a single protocol and host prefix."],
["gsc",2,"Does clicking 'Request indexing' in URL Inspection guarantee a page gets indexed?","No — it queues a crawl. The quota is limited and indexing isn't guaranteed",["Yes, within an hour","Yes, permanently","Only for HTTPS pages"],"Use it for important new or updated pages. It won't override quality or technical issues."],
["ai",2,"What special markup do you need to appear in Google's AI Overviews?","None — the page just needs to be indexed and eligible for a snippet in Google Search",["`AIOverview` schema","An llms.txt file","A Google-Extended Allow rule"],"Google says the usual Search best practices apply. There's no special optimization file or markup."],
["ai",2,"How can you limit what content Google shows from your page in AI Overviews?","Use `nosnippet`, `data-nosnippet` or `max-snippet` — the same snippet controls as Search",["Block Google-Extended","Use llms.txt","Add `noai` to robots.txt"],"Google's AI features in Search follow the same preview controls as regular snippets."],
["ai",3,"If you block `GPTBot` in robots.txt, are you blocked from ChatGPT search results?","Not necessarily — OpenAI uses `OAI-SearchBot` for search. GPTBot is for training",["Yes, GPTBot powers everything","Yes, and from Google too","Only for images"],"AI companies often run separate crawlers for training and for search or retrieval. Check each one's documentation and decide one at a time."],
["ai",2,"What is llms.txt?","A proposed convention for giving LLMs a markdown summary of a site. Google has said Search doesn't use it",["An official Google standard required for AI Overviews","A robots.txt replacement","A W3C standard"],"It's an emerging proposal with uneven adoption. Don't expect it to affect Google Search."],
["ai",3,"Why can heavy client-side rendering hurt visibility in AI assistants and answer engines?","Many AI crawlers fetch the raw HTML and don't execute JavaScript, so they miss JS-only content",["AI crawlers can't read HTML","LLMs penalize React","AI crawlers only read sitemaps"],"Server-rendered content is readable by the widest range of bots."],
["crawl",2,"A dev adds `Disallow: /` under `User-agent: *` on staging, and it ships to production. What's the first symptom you'd expect?","Pages start showing in results with no description, then traffic drops as Google stops crawling",["Instant removal of every page","A manual action notice","No effect, because sitemaps override it"],"Already-indexed URLs may linger without snippets. Always check robots.txt after every deploy."],
["index",3,"A page has two different `rel=canonical` tags. How does Google handle it?","It will likely ignore both and pick its own canonical",["It uses the first one","It uses the last one","It indexes both URLs"],"Multiple conflicting canonicals cancel each other out. Make sure plugins and templates don't both add one."],
["index",2,"Where must the robots meta tag go to be reliably honored?","In the `<head>` of the HTML",["Anywhere in the body","In the footer","In the sitemap"],"If invalid elements break the head early (for example an injected `<img>` or `<div>`), the browser parser may end the head and the robots tag may be missed."],
["status",3,"What's the main drawback of a JavaScript redirect compared with a server-side 301?","Google only sees it after rendering, so it's slower and less reliable. Other crawlers may never see it",["Google can't follow it at all","It passes negative PageRank","It creates a soft 404"],"Use server-side redirects whenever you can. Use JS redirects only when you have no server access."],
["cwv",2,"How can you make the LCP image load sooner?","Put the image in the initial HTML, preload it if needed, and add `fetchpriority=\"high\"`",["Lazy-load it","Load it with JavaScript after `onload`","Convert it to a CSS background"],"The browser should discover the LCP resource as early as possible and treat it as a priority."],
["schema",3,"You mark up a product with `offers.price` that differs from the price shown on the page. What's the likely outcome?","The markup may be disregarded, and it can trigger a manual action for misleading structured data",["Google shows the markup price","Nothing — Google ignores price","It improves click-through rate"],"Structured data must match the visible content. Merchant Center mismatches can also get products disapproved."],
["intl",1,"You have the same English page for the US and the UK, with different prices. What tells Google which version to show in each country?","hreflang tags (`en-US` and `en-GB`) on both pages, pointing to each other",["A canonical from the UK page to the US page","Translating the UK page into another language","Putting both versions on one URL"],"hreflang helps Google show the right regional version. Each page should list itself and every alternate."],
["arch",3,"Breadcrumb navigation mainly helps technical SEO by:","Adding hierarchical internal links and making the site structure clear to crawlers",["Removing the need for a sitemap","Improving INP","Blocking duplicate content"],"Breadcrumbs link each page up to its parent categories, which spreads link equity through the hierarchy."],
["sitemap",1,"Where in Search Console can you see whether your sitemap was read and how many pages it found?","Indexing → Sitemaps",["Performance → Search results","Links","Settings → Users and permissions"],"The Sitemaps report shows status, last read date and discovered pages. Click through to see indexing for just that sitemap's URLs."],
["logs",3,"Log files show Googlebot hitting thousands of `?sort=price&color=red&size=9` URLs. What's the best first fix?","Stop linking to these combinations in crawlable form and disallow low-value parameter patterns in robots.txt",["Add noindex to them","Delete your sitemap","Return 500 for parameter URLs"],"noindex still requires crawling. robots.txt and link hygiene cut the crawl waste at the source."],
["crawl",3,"Google's large-site crawler docs: what can trap an important page in 'Discovered – currently not indexed' for months?","A huge volume of low-value URLs, such as faceted or parameter URLs, using up Googlebot's crawl capacity",["Having too few backlinks to the homepage","Using JSON-LD instead of microdata","Serving the site over HTTP/2"],"When Googlebot spends its crawl capacity on junk URLs, discovered pages wait in the queue. Clean up crawl paths so it reaches what matters."],

["news",2,"In April 2026, Google added 'back button hijacking' to its spam policies. Which policy category does it fall under?","Malicious practices — with enforcement from June 15, 2026",["Site reputation abuse","Scaled content abuse","Link spam"],"Google classed manipulating browser history to trap users as a malicious practice, with manual actions or automated demotions as penalties. Third-party ad scripts and libraries can be the cause, so audit them too."],
["news",2,"Google's 2026 docs say Googlebot only reads the first 2 MB of a page's HTML. Who does this actually affect?","Very few sites — only pages with enormous HTML, such as huge inline scripts or data",["Every site — most pages are over 2 MB","Image-heavy pages, because images count toward the limit","Only sites on slow hosting"],"Images, CSS and JS are fetched separately and don't count toward it. For almost every normal page, this is nothing to worry about."],
["news",1,"In March 2026, Google moved the files that list its crawler IP addresses. Who usually needs to act?","Your developer or hosting team, if they run firewall or bot-blocking rules that use those files",["Every site owner must resubmit their sitemap","Content writers must update their pages","Nobody — Google deleted the files"],"Most SEOs don't need to do anything. If your site uses custom bot checks, let the devs know so the real Googlebot doesn't get blocked."],
["news",2,"In October 2026, Google, OpenAI, Anthropic and Microsoft backed a shared robots.txt token for opting out of AI training. What is it?","`__usage_ai-training`",["`Google-Extended`","`noai`","`GPTBot`"],"It comes from an IETF AI Preferences draft. Google said it aims to support it in 2027, and Google-Extended keeps working in the meantime. Blocking AI training doesn't stop Googlebot from indexing you for Search."],
["news",2,"What does the generative AI control that Google added to Search Console in 2026 do?","Lets a site opt out of appearing in, and grounding, AI Overviews, AI Mode and Discover's AI features. Google says it isn't a ranking signal for regular results",["It blocks Google from training Gemini on your content","It removes the site from Google Search entirely","It turns off AI Overviews for everyone searching your brand"],"It's a presentation control for Search's generative features, not a training control. Sites that opt out get no traffic or impressions from those features."],
["news",1,"What was unusual about Google's February 2026 core update?","It was the first core update Google publicly labeled as Discover-only",["It was the first update targeting AI-written content","Google rolled it back after a week","It only affected EU countries"],"Google's 2026 run of updates included the February Discover core update, a March spam update, a March core update and a May core update."],
["news",2,"In November 2026, Gary Illyes explained what can happen when a very important URL suddenly starts returning a 4xx. What did he say?","Google Search may temporarily protect it from dropping out of the index right away",["It's removed from the index within the hour","Google shows the 4xx error page in results","It triggers an automatic manual review"],"His example was VLC's site serving a 418 status. Normally 4xx means 'not found', but Google can briefly hold on to very important URLs. Don't count on that for your own pages."],

function dateKey(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(k,n){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
function hash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; }; }
function rng(seed){ let a=hash(seed)(); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>"); }

function rankOf(xp){ let r=RANKS[0],n=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){ r=RANKS[i]; n=RANKS[i+1]||null; } } return {r,n}; }
function catAcc(c){ const v=S.cat[c]; return v&&v[1] ? v[0]/v[1] : null; }

/* ---------- Daily set generation ----------
   10 questions: up to 2 you previously missed (spaced review), weighted toward your weakest
   categories and least-seen questions, with a 5 easy / 4 medium / 1 hard mix. */
function buildDaily(key){
  const r = rng("crawldaily|"+key);
  const ids = [];
  const review = Object.keys(S.missed).map(Number).filter(id => S.missed[id] < key && QUIZABLE(id));
  shuffle(review, r).slice(0,2).forEach(id => ids.push(id));
  const targets = {1:5,2:4,3:1};
  ids.forEach(id => targets[BANK[id][1]] = Math.max(0, targets[BANK[id][1]]-1));
  const weight = id => {
    const c = BANK[id][0], acc = catAcc(c), seen = S.seen[id]||0;
    return (1/(1+seen*1.5)) * (acc===null ? 1.2 : 1.6-acc) * (0.5+r());
  };
  const usedCats = {};
  for (const d of [1,2,3]) {
    let pool = BANK.map((_,i)=>i).filter(i => QUIZABLE(i) && BANK[i][1]===d && !ids.includes(i));
    pool.sort((a,b)=>weight(b)-weight(a));
    for (const id of pool) {
      if (targets[d]<=0) break;
      const c = BANK[id][0];
      if (c==="news" || (usedCats[c]||0) >= 2) continue;
      ids.push(id); usedCats[c]=(usedCats[c]||0)+1; targets[d]--;
    }
  }
  return shuffle(ids, r).sort((a,b)=>BANK[a][1]-BANK[b][1]);
}
function ensureDaily(){
  const k = dateKey();
  if (!S.daily || S.daily.date !== k || (!S.daily.answers.length && !S.daily.ids.every(QUIZABLE))) { S.daily = { date:k, ids:buildDaily(k), answers:[], done:false }; save(); }
  return S.daily;
}
function optionOrder(id, salt){
  const q = BANK[id]; const opts = [q[3], ...q[4]];
  return shuffle(opts.map((t,i)=>({t, ok:i===0})), rng(salt+"|"+id));
}

}
let cdTimer;
function tick(){ clearInterval(cdTimer); const f=()=>{ const el=$("#cd"); if(!el) return clearInterval(cdTimer); const now=new Date(), m=new Date(now); m.setHours(24,0,0,0); const s=Math.floor((m-now)/1000); el.textContent=`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`; if(s<=0){clearInterval(cdTimer);home();} }; f(); cdTimer=setInterval(f,30000); }

/* ---------- Quiz engine ---------- */
let RUN = null; // {mode, ids, answers, salt}
function startDaily(){ const d=ensureDaily(); RUN={mode:"daily",ids:d.ids,answers:d.answers,salt:d.date}; question(); }
function startPractice(){
  const sel=$("#pcat").value, r=rng("p"+Date.now()+Math.random());
  let pool=BANK.map((_,i)=>i).filter(QUIZABLE);
  if(sel==="__review") pool=Object.keys(S.missed).map(Number).filter(QUIZABLE);
  else if(sel==="__weak"){ const t=Object.keys(CATS).filter(c=>S.cat[c]&&S.cat[c][1]).sort((a,b)=>catAcc(a)-catAcc(b))[0]; pool=pool.filter(i=>BANK[i][0]===t); }
  else if(sel) pool=pool.filter(i=>BANK[i][0]===sel);
  const ids=shuffle(pool,r).slice(0,10).sort((a,b)=>BANK[a][1]-BANK[b][1]);
  RUN={mode:"practice",ids,answers:[],salt:"p"+Date.now()}; question();
}
function question(){
  VIEW="quiz"; app.className="narrow"; document.getElementById("hdr").className="narrow";
  const i=RUN.answers.length; if(i>=RUN.ids.length) return finish();
  const id=RUN.ids[i], q=BANK[id], opts=optionOrder(id,RUN.salt);
  const isReview = RUN.mode==="daily" && S.missed[id]!==undefined;
  app.innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="meta">${RUN.mode==="daily"?"Daily":"Practice"} · ${i+1} / ${RUN.ids.length}</span><button class="btn ghost" style="padding:6px 12px;font-size:13px" onclick="home()">Exit</button></div>
    <div class="progress"><div style="width:${i/RUN.ids.length*100}%"></div></div>
    <div class="card">
      <div class="tags"><span class="tag">${CATS[q[0]]||"SEO news"}</span><span class="tag d${q[1]}">${DIFF[q[1]]} · ${XP[q[1]]}xp</span>${isReview?'<span class="tag rev">Review</span>':""}</div>
      <div class="q">${fmt(q[2])}</div>
      <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${fmt(o.t)}</span></button>`).join("")}</div>
      <div id="after"></div>
    </div>`;
  const btns=[...document.querySelectorAll(".opt")];
  let sel=-1;
  const choose=j=>{
    if(btns[0].disabled) return;
    sel=j; btns.forEach((b,k)=>b.classList.toggle("sel",k===j));
    $("#after").innerHTML=`<div class="confirm"><span>Lock in answer <b>${"ABCD"[j]}</b>? Are you sure?</span><button class="btn ghost" id="chg">Change</button><button class="btn" id="lock">Yes, lock it in</button></div>`;
    $("#chg").onclick=()=>{ sel=-1; btns.forEach(b=>b.classList.remove("sel")); $("#after").innerHTML=""; };
    $("#lock").onclick=()=>pick(sel); $("#lock").focus();
  };
  const pick=j=>{
    if(btns[0].disabled||j<0) return;
    btns.forEach(b=>{ b.disabled=true; b.classList.remove("sel"); });
    const ok=opts[j].ok;
    btns.forEach((b,k)=>{ if(opts[k].ok) b.classList.add("right"); else if(k===j) b.classList.add("wrong"); });
    record(id,ok);
    RUN.answers.push(ok?1:0); if(RUN.mode==="daily"){ S.daily.answers=RUN.answers; } save();
    const last=RUN.answers.length>=RUN.ids.length;
    $("#after").innerHTML=`<div class="explain ${ok?"":"bad"}"><strong>${ok?"Correct — +"+(RUN.mode==="daily"?XP[q[1]]:XP[q[1]]/2)+" XP":"Not quite"}</strong>${fmt(q[5])}</div>
      <div class="foot"><span class="note">Press Enter to continue</span><button class="btn" id="next">${last?"See results":"Next question"} →</button></div>`;
    $("#next").onclick=question; $("#next").focus();
  };
  btns.forEach((b,j)=>b.onclick=()=>choose(j));
  document.onkeydown=e=>{
    if(btns[0].disabled) return;
    if(e.key==="Enter"&&sel>-1){ e.preventDefault(); pick(sel); return; }
    if(e.key==="Escape"&&sel>-1){ $("#chg").click(); return; }
    const n="1234abcd".indexOf(e.key.toLowerCase()); if(n>-1&&n%4<btns.length) choose(n%4);
  };
}
function record(id,ok){
  const q=BANK[id], c=q[0];
  S.cat[c]=S.cat[c]||[0,0]; S.cat[c][1]++; if(ok) S.cat[c][0]++;
  S.seen[id]=(S.seen[id]||0)+1;
  if(ok){ S.xp+=RUN.mode==="daily"?XP[q[1]]:XP[q[1]]/2; delete S.missed[id]; }
  else S.missed[id]=dateKey();
}
function finish(){
  document.onkeydown=null;
  if(RUN.mode==="daily" && !S.daily.done){
    const k=S.daily.date, score=RUN.answers.reduce((a,b)=>a+b,0);
    S.daily.done=true; S.history[k]=score;
    S.streak = S.lastDaily===addDays(k,-1) ? S.streak+1 : (S.lastDaily===k ? S.streak : 1);
    S.lastDaily=k; S.bestStreak=Math.max(S.bestStreak,S.streak);
    if(score===10) S.xp+=50;
    save();
  }
  pushScore();
  results();
}
function results(forceDaily){
  VIEW="results"; app.className="narrow"; document.getElementById("hdr").className="narrow";
  const run = !forceDaily && RUN && RUN.answers.length===RUN.ids.length ? RUN : {mode:"daily",ids:S.daily.ids,answers:S.daily.answers};
  const score=run.answers.reduce((a,b)=>a+b,0), n=run.ids.length;
  const msg = score===n?"Flawless crawl. +50 XP bonus.":score>=8?"Strong work — you know your stuff.":score>=5?"Solid. Read the explanations for the misses.":"Rough one — missed questions come back for review.";
  app.innerHTML=`
    <div class="card">
      <div class="label">${run.mode==="daily"?"Daily results":"Practice results"}</div>
      <div class="big">${score}<span style="font-size:24px;color:var(--muted)">/${n}</span></div>
      <p style="margin-top:8px">${msg}</p>
      ${run.mode==="daily"?`<p class="note">Streak: ${S.streak} day${S.streak===1?"":"s"} 🔥 · Come back tomorrow for a new set.</p>`:""}
      <div class="row" style="margin-top:14px"><button class="btn" onclick="home()">Back to dashboard</button><button class="btn ghost" onclick="copyScore(${score},${n},'${run.mode}')" id="cp">Copy score</button></div>
    </div>
    <div class="section"><div class="label">Review</div><div class="review">${run.ids.map((id,i)=>{const q=BANK[id],ok=run.answers[i];return `<details class="rv" style="display:block"><summary style="display:flex;gap:10px;cursor:pointer;list-style:none"><span class="m ${ok?"ok":"no"}">${ok?"✓":"✗"}</span><span>${fmt(q[2])}</span></summary><div class="explain ${ok?"":"bad"}" style="margin-top:10px"><strong>Answer: ${fmt(q[3])}</strong>${fmt(q[5])}</div></details>`}).join("")}</div></div>`;
}
function copyScore(s,n,mode){
  const sq=(RUN&&RUN.answers.length===RUN.ids.length?RUN.answers:S.daily.answers).map(a=>a?"🟩":"🟥").join("");
  const txt=`SEO Daily ${mode==="daily"?S.daily.date:"practice"} — ${s}/${n}\n${sq}${mode==="daily"?`\n🔥 ${S.streak}-day streak`:""}`;
  try{ navigator.clipboard.writeText(txt).then(()=>{$("#cp").textContent="Copied!"},()=>{$("#cp").textContent="Copy blocked"}); }catch(e){ $("#cp").textContent="Copy blocked"; }
}
let resetArmed=false;
function resetAll(e){ e.preventDefault(); if(!resetArmed){ resetArmed=true; e.target.textContent="Click again to confirm reset"; setTimeout(()=>{resetArmed=false; if(e.target) e.target.textContent="Reset progress";},4000); return; } S={xp:0,streak:0,bestStreak:0,lastDaily:null,history:{},cat:{},seen:{},missed:{},daily:null,season:S.season,name:S.name,pid:S.pid}; save(); lastPushed=""; pushScore(); resetArmed=false; home(); }

/* ---------- Team leaderboard (Google Sheet via Apps Script) ----------
   Paste your Apps Script web app URL between the quotes. Leave empty to hide the leaderboard. */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwny_kai6IqjBCpYHqAcKhiFXxWcN4pnrcJFh91ezSI4r4Nl_Dw5VwwjMyEcBh4RMlY/exec";
let BOARD=[], BOARD_STATE="loading", BOARD_TAB="week", VIEW="home", SEASON_SEEN=false;
let writeChain=Promise.resolve(), lastPushed="", pollTimer=null;
const num=(v,max=1e7)=>{ const n=Number(v); return Number.isFinite(n)&&n>=0 ? Math.min(n,max) : 0; };
function weekStartKey(k){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()-((dt.getDay()+6)%7)); return dateKey(dt); }
function recentHistory(){ const k=dateKey(), out={}; for(let i=0;i<14;i++){ const dk=addDays(k,-i); if(S.history[dk]!=null) out[dk]=S.history[dk]; } return out; }
function newId(){ const a=new Uint8Array(12); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<12;i++) a[i]=Math.random()*256|0; } return Array.from(a,b=>b.toString(16).padStart(2,"0")).join(""); }
function pushScore(){
  if(!SHEET_URL||!S.pid||!S.name||!SEASON_SEEN) return;
  const row={id:S.pid, name:S.name, xp:S.xp, streak:S.streak, bestStreak:S.bestStreak, lastDaily:S.lastDaily||"", recent:recentHistory(), season:S.season||""};
  const sig=JSON.stringify(row); if(sig===lastPushed) return; lastPushed=sig;
  writeChain=writeChain.then(()=>fetch(SHEET_URL,{method:"POST",body:sig})).then(()=>loadBoard()).catch(()=>{ lastPushed=""; });
}
function setTab(t){ BOARD_TAB=t; document.querySelectorAll(".board-tabs button").forEach((b,i)=>b.classList.toggle("on",["today","week","xp","streak"][i]===t)); renderBoard(); }
function boardRows(){
  const today=dateKey(), yest=addDays(today,-1), ws=weekStartKey(today);
  return BOARD.map(r=>{
    const recent=(r.recent&&typeof r.recent==="object")?r.recent:{};
    const live=(r.lastDaily===today||r.lastDaily===yest)?num(r.streak,5000):0;
    let week=0; for(const [d,v] of Object.entries(recent)) if(d>=ws&&d<=today) week+=num(v,10);
    const val={today:recent[today]!=null?num(recent[today],10):null, week, xp:num(r.xp), streak:live}[BOARD_TAB];
    return {id:String(r.id), name:String(r.name||"").slice(0,30), val, xp:num(r.xp)};
  }).filter(r=>r.val!==null && r.val>0).sort((a,b)=>b.val-a.val||b.xp-a.xp).slice(0,25);
}
function renderBoard(){
  const el=document.getElementById("board"); if(!el) return;
  const live=document.getElementById("board-live");
  if(!SHEET_URL){ el.innerHTML='<p class="note">The team leaderboard isn\'t connected yet.</p>'; return; }
  if(BOARD_STATE==="loading"&&!BOARD.length){ el.innerHTML='<p class="note">Loading leaderboard…</p>'; return; }
  if(BOARD_STATE==="error"&&!BOARD.length){ el.innerHTML='<p class="note">Can\'t reach the leaderboard right now. Your progress is still saved in this browser.</p>'; return; }
  const rows=boardRows();
  if(live) live.textContent = BOARD.length ? `${BOARD.length} player${BOARD.length===1?"":"s"}` : "";
  el.innerHTML="";
  const unit={today:"/10",week:" pts",xp:" XP",streak:" 🔥"}[BOARD_TAB];
  const empty={today:"Nobody has finished today's quiz yet. Be the first.",week:"No scores yet this week.",xp:"No players yet.",streak:"No active streaks right now."}[BOARD_TAB];
  if(!rows.length){ const p=document.createElement("p"); p.className="note"; p.textContent=empty; el.appendChild(p); }
  else {
    const list=document.createElement("div"); list.className="lb";
    rows.forEach((r,i)=>{
      const me=r.id===S.pid;
      const row=document.createElement("div"); row.className="lb-row"+(me?" me":"");
      const pos=document.createElement("span"); pos.className="pos"+(i<3?" top":""); pos.textContent=i<3?["🥇","🥈","🥉"][i]:String(i+1);
      const av=document.createElement("span"); av.className="av"; av.textContent=(r.name.trim()[0]||"?").toUpperCase(); av.style.background=`hsl(${[...r.id].reduce((h,c)=>h*31+c.charCodeAt(0)>>>0,7)%360} 45% 45%)`;
      const nm=document.createElement("span"); nm.className="nm"; nm.textContent=r.name||"Player";
      if(me){ const y=document.createElement("small"); y.textContent="you"; nm.appendChild(y); }
      const val=document.createElement("span"); val.className="val"; val.textContent=r.val+unit;
      row.append(pos,av,nm,val); list.appendChild(row);
    });
    el.appendChild(list);
  }
  const note=document.createElement("p"); note.className="note"; note.style.marginTop="10px";
  note.textContent="Your score posts when you finish a quiz. Weekly totals reset every Monday.";
  el.appendChild(note);
}
async function loadBoard(){
  if(!SHEET_URL) return;
  try{
    const r=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+"t="+Date.now());
    const j=await r.json();
    BOARD=Array.isArray(j.rows)?j.rows:[]; BOARD_STATE="ok";
    // Season: running resetLeaderboard() in the Sheet's script starts a new season, which wipes everyone's progress.
    const season=typeof j.season==="string"?j.season.slice(0,64):"";
    if(!SEASON_SEEN){ SEASON_SEEN=true;
      if((S.season||"")!==season){
        if(S.season!==undefined||season!==""){  // a reset has happened since this browser last synced: wipe S={xp:0,streak:0,bestStreak:0,lastDaily:null,history:{},cat:{},seen:{},missed:{},daily:null,name:S.name,pid:S.pid}; if(RUN&&RUN.mode==="daily") RUN=null; }
        S.season=season; save(); if(VIEW==="home") home();
      }
      pushScore();
    }
  }catch(e){ BOARD_STATE="error"; }
  renderBoard();
}
function initBoard(){
  if(!SHEET_URL){ renderBoard(); return; }
  loadBoard();
  clearInterval(pollTimer); pollTimer=setInterval(()=>{ if(!document.hidden&&VIEW==="home") loadBoard(); },60000);
}
/* ---------- Name ---------- */
function nameScreen(){
  VIEW="name"; app.className="narrow"; document.getElementById("hdr").className="narrow";
  app.innerHTML=`<div class="card"><div class="label">Welcome to SEO Daily</div><h1>What's your name?</h1>
    <p class="note">This is how you'll appear on the team leaderboard. Your progress saves in this browser, like Wordle.</p>
    <form id="nf" class="row" style="margin-top:14px"><input id="nm" maxlength="30" autocomplete="name" placeholder="e.g. Jayden" style="flex:1;min-width:180px;font:16px var(--sans);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><button class="btn" type="submit">Start →</button></form></div>`;
  $("#nm").value=S.name||""; $("#nm").focus();
  $("#nf").onsubmit=e=>{ e.preventDefault(); const v=$("#nm").value.replace(/\s+/g," ").trim().slice(0,30); if(!v) return; S.name=v; if(!S.pid) S.pid=newId(); save(); lastPushed=""; pushScore(); home(); };
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.daily && S.daily.date!==dateKey() && (!RUN||RUN.mode!=="practice")) home(); });
home();
initBoard();
</script>
