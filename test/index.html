["onpage",1,"Roughly how long should a title tag be so it usually isn't cut off in Google results?","About 50–60 characters",["10–15 characters","150–160 characters","There's no visible limit"],"Google truncates by pixel width, so treat this as a guide. Put the main keyword and the page's key benefit near the start."],
["onpage",1,"Does the meta description directly affect rankings?","No, but a good one can improve click-through rate",["Yes, it's a major ranking factor","Only if it repeats the keyword three times","Only on mobile"],"Google often rewrites descriptions to match the search. Write a clear, specific summary of what the page offers."],
["onpage", 1, "How many H1 headings should a typical page have?", "Usually one, describing the page's main topic", ["At least five, so each one can target a different related keyword", "None, because Google ignores headings", "One for every paragraph on the page"], "Google says multiple H1s aren't a problem, but one clear H1 keeps things simple. Use H2s and H3s for sections."],
["onpage", 2, "Two blog posts on your site target almost the same keyword and keep swapping places in rankings. What's this, and the common fix?", "Keyword cannibalization: merge them and 301 the weaker one", ["A duplicate content penalty: delete both posts", "Too few keywords: add the term to both posts more often so one wins", "Link spam: disavow the links pointing at both"], "In Search Console, filter Performance by the query and open the Pages tab to see which URLs compete. One strong page usually beats two split ones."],
["onpage", 1, "What's image alt text mainly for?", "Describing the image for screen readers and search engines", ["Telling the browser which images to load first so the page is faster", "Setting the image's display width and height", "Hiding the image from Google's crawlers"], "Write a short, accurate description. Include a keyword only when it naturally describes the image."],
["onpage", 2, "A useful page ranks on page 2. Which change is most likely to help?", "Link to it from strong, relevant pages with descriptive anchors", ["Change its URL every month so it looks fresh and new to Google", "Add more keywords to the page's meta keywords tag", "Add extra keywords in white text at the bottom"], "Internal links help Google find and understand your important pages. Google ignores the meta keywords tag, and hidden text is spam."],
["onpage", 2, "Google shows a different title in the results from your title tag. Why?", "Google rewrites titles it thinks don't describe the page well", ["Your site has a manual action that hides titles", "robots.txt is blocking Google from reading the title tag on the page", "Google always replaces titles with the page's H1"], "Keep titles accurate, unique and concise. When Google rewrites a title, it often uses the H1 or other prominent text."],
["gsc", 1, "In the Performance report, what's the difference between impressions and clicks?", "Impressions are times your result was shown; clicks are visits", ["They're two names for the same metric", "Clicks include clicks on your Google Ads too", "Impressions only count appearances on the first page of results"], "CTR is clicks divided by impressions. High impressions with a low CTR often means the title or snippet needs work."],
["gsc", 2, "Organic clicks dropped 30% week over week. What's a good first step in Search Console?", "Compare the two weeks to see which pages and queries lost clicks", ["Delete the property and add it again to refresh the data in the report", "Request indexing for every URL on the site", "Disavow all backlinks in case of a negative SEO attack"], "First work out whether it's one page or sitewide. Then check the Pages (indexing) report, Manual actions, and whether Google has confirmed an update."],
["gsc",1,"Where in Search Console do you see why pages aren't indexed?","Indexing → Pages",["Performance → Search results","Settings → Users and permissions","Links → Top linking sites"],"It lists reasons like 'Excluded by noindex tag', 'Page with redirect' and 'Not found (404)'. Lots of exclusions are normal, so focus on pages you actually want indexed."],
["gsc", 2, "A page you want ranking shows 'Excluded by noindex tag'. What usually happened?", "A noindex was left on, often from staging or a CMS setting", ["Google penalized the page for thin content and excluded it from results", "The sitemap entry is blocking the page", "The page has too few words to be indexed"], "Check the page source for `noindex`, and settings like WordPress's 'Discourage search engines'. Remove it, then request indexing in URL Inspection."],
["status", 1, "A site audit finds 150 internal links pointing to 404 pages. What's the fix?", "Point links at working pages, or 301 dead URLs to close matches", ["Ignore them, because 404s never affect SEO", "Redirect every dead URL to the homepage", "Add the 404 URLs to the sitemap so Google recrawls and drops them faster"], "Broken internal links frustrate users and waste link value. Start with links in the navigation and on high-traffic pages."],
["index", 1, "An audit flags hundreds of pages with the same title tag, like 'Products | Brand'. Why fix it?", "Unique titles help Google and searchers tell the pages apart", ["Duplicate titles trigger an automatic manual action", "Google will deindex every page that shares a title with another page", "Duplicate titles make the pages load more slowly"], "A template is usually the cause. Set it to include each category or product name automatically."],
["local", 1, "What matters most for showing up in Google's local map results?", "A complete Business Profile, plus relevance, distance and prominence", ["Having more pages on your website than any of your local competitors", "Running Google Ads campaigns targeted at the local area", "Having the main keyword in your business's domain name"], "Google says local results are mainly based on relevance, distance and prominence. Keep categories, hours and photos up to date, and reply to reviews."],
["local", 1, "Why keep your business name, address and phone number consistent across the web?", "So Google and customers trust it's the same business", ["It's a legal requirement for every registered business", "It stops competitors from creating similar listings", "It's needed before a site can use an HTTPS certificate"], "Mismatched details across directories, your site and your Business Profile confuse people and search engines. Update all of them after a move."],
["local", 2, "A product is temporarily out of stock. What's usually best for SEO?", "Keep the page live, mark it out of stock and suggest alternatives", ["Delete the page and let it return a 404 until the product is restocked", "Redirect it to the homepage until the stock returns", "Noindex it until it's back, then remove the tag"], "The URL keeps its rankings and links. Only redirect or remove pages for products that are gone for good."],
["local", 2, "Color and size filters on a category page create thousands of URLs. What's a sensible starting rule?", "Only make filter pages people actually search for indexable", ["Let every filter combination be indexed for long-tail traffic", "Block the whole category in robots.txt to stop the duplicates", "Noindex the main category page and keep the filter pages"], "Popular filters can deserve their own optimized pages. The rest should canonicalize to the main category or stay out of the crawl."],
["local", 1, "Your product pages use the manufacturer's description word for word, like dozens of other stores. What's the risk?", "They add nothing unique, so they struggle against identical text", ["A penalty that deindexes the whole site", "Nothing, because Google prefers the official descriptions from the brand", "The products get removed from Google Shopping"], "There's no penalty, but Google usually shows just one version of identical text. Add your own details, sizing tips, FAQs and reviews."],
["news",2,"In November 2026, John Mueller explained how to keep a third-party popup out of the page Google renders. What did he suggest?","Disallow the popup's script in robots.txt (on the vendor's domain, or a JS file used only for the popup), as long as the page still works without it",["Add `noindex` to the popup's HTML","Block every JavaScript file on the site in robots.txt","Wrap the popup in a `data-nosnippet` element"],"Googlebot doesn't fetch disallowed resources when rendering. Only block a file that does nothing but load the popup — blocking a shared, multipurpose script can break how Google sees the whole page."],
["news",2,"Gary Illyes explained redirects in November 2026. After a 302 redirect, which URL does Google usually keep showing in search results?","The original, redirecting URL, because a 302 says the move is temporary",["The target URL, exactly as with a 301","Neither — a 302 drops both URLs from the index","Whichever of the two URLs has more backlinks"],"A 301 (or 308) makes the new URL canonical and moves ranking signals to it. A 302 (or 307) tells Google the old URL will come back. For a permanent move, use a 301."],
["news",3,"In November 2026, Google extended its aggregator and supplier units to 'things to do' queries. Where do these units appear?","Only in Google Search for users in the European Economic Area (EEA)",["Worldwide, in every Google Search market","Only in Google Maps in the United States","Only inside AI Mode answers"],"These units are part of Google's Europe-specific results layout, with one unit for comparison sites and one for direct providers. If you run a tours or activities site with EU visitors, check Google's aggregator and supplier unit docs."],

["crawl", 3, "What does Google do when robots.txt keeps returning 5xx server errors?", "It treats the site as fully disallowed at first", ["It ignores robots.txt and crawls everything", "It deindexes the whole site straight away", "It treats the file as missing, like a 404"], "A server error on robots.txt makes Google cautious: crawling is paused at first. If the errors go on for a long time, Google uses its last cached copy. Some time later, if the site is otherwise reachable, it can behave as if there's no robots.txt."],

["index", 3, "What does the robots meta directive `unavailable_after: [date]` do?", "Stops the page appearing in results after that date", ["Deletes the page from your server on that date", "Delays indexing of the page until that date", "Sets the date the browser cache expires for users"], "It's useful for time-limited pages like events or promotions. Google may remove the page from results after the date."],
["status", 3, "When does a server return 304 Not Modified to Googlebot?", "When a conditional request shows the page hasn't changed", ["When the page has moved permanently to a new URL", "When the page is too large for Googlebot to fetch", "When Googlebot is crawling faster than the server allows"], "Supporting conditional requests saves bandwidth and crawl resources, because Google can reuse its stored copy."],
["status",3,"How does Google interpret an instant (0-second) meta refresh?","As a permanent redirect",["As a temporary redirect","It ignores it","As a soft 404"],"Instant meta refreshes are treated as permanent and delayed ones as temporary. Server-side redirects are still preferred."],
["cwv", 3, "Do scrolling and hovering count as interactions for INP?", "No, only clicks, taps and key presses count", ["Yes, both scrolling and hovering count as interactions", "Only scrolling counts, not hovering", "Only hovering counts, not scrolling"], "Scroll and hover aren't measured by INP, although JavaScript triggered by them can still block the main thread."],
["cwv", 3, "Is TTFB a Core Web Vital?", "No, but it feeds directly into LCP", ["Yes, it replaced CLS in March 2024", "Yes, it's the most heavily weighted vital", "No, and it doesn't affect any other metric"], "A slow server response pushes back everything that follows, including LCP."],
["cwv", 3, "What can stop a page from being eligible for the back/forward cache (bfcache)?", "`unload` event handlers, among other things", ["Serving the page over HTTPS", "Having structured data on the page", "Using lazy-loaded images below the fold on the page"], "bfcache makes back and forward navigation instant. `unload` listeners and certain headers, such as `Cache-Control: no-store` in some browsers, block it."],
["schema", 3, "What does `@id` do in JSON-LD?", "Gives a node an identifier that other nodes can reference", ["Sets the canonical URL that Google indexes for the page", "Is required for every type of rich result", "Hides the markup from Google's parsers"], "Using `@id`, for example `https://example.com/#organization`, lets you connect Organization, WebSite and Article nodes into one coherent graph."],
["sitemap", 3, "Can you still notify Google of a sitemap with the `google.com/ping?sitemap=` endpoint?", "No, Google retired the sitemap ping endpoint in 2023", ["Yes, it's still the fastest way to get a recrawl", "Yes, but only for Google News sitemaps", "Only for sitemaps smaller than 1 MB"], "Use Search Console or the robots.txt Sitemap line, and keep `<lastmod>` accurate."],
["sitemap",3,"How many sitemaps can one sitemap index file list?","Up to 50,000",["Up to 500","Up to 1,000","Unlimited"],"A sitemap index follows the same 50,000-entry and 50 MB limits as a regular sitemap."],
["logs", 3, "How do you verify that a request in your logs really came from Googlebot?", "Reverse DNS to googlebot.com or google.com, confirmed by forward DNS", ["Trust the user-agent string, because Googlebot always sends it", "Check the referrer header for a google.com address", "Look for the Google Analytics cookie on the request"], "User-agents are easy to spoof. DNS verification or Google's IP lists are reliable."],
["mobile",3,"With dynamic serving (same URL, different HTML per device), which header should you send?","`Vary: User-Agent`",["`X-Robots-Tag: mobile`","`Content-Language`","`Cache-Control: mobile`"],"It tells caches and crawlers that the response differs by user-agent."],
["mobile", 3, "With separate mobile URLs (m.example.com), how should the annotations work?", "Desktop has `rel=alternate` to mobile; mobile canonicals to desktop", ["Both versions canonicalize to themselves, with no alternate", "Mobile canonicalizes to mobile, with no annotation on desktop", "hreflang tags link the desktop and mobile versions together"], "This bidirectional annotation tells Google the two URLs are the same content. Responsive design avoids all of this."],
["mobile", 3, "When crawling for Google Search, how much of an HTML file does Googlebot fetch?", "The first 2 MB of uncompressed HTML", ["The first 15 MB of uncompressed HTML", "The first 100 KB of the HTML file", "The whole file, no matter how large"], "Google clarified this in its 2026 docs: Googlebot fetches 2 MB for HTML and 64 MB for PDFs, and 15 MB is the default for Google's other crawlers. CSS, JS and other referenced resources each have their own separate limit."],
["intl", 3, "Where do hreflang annotations go in an XML sitemap?", "As `xhtml:link` elements inside each `<url>` entry", ["In a separate `<hreflang>` element at the root", "Only in the sitemap index, not in the sitemaps", "As comments next to each `<loc>` entry"], "Each `<url>` lists every alternate, including itself. Sitemaps keep large hreflang sets out of the HTML head."],
["sitemap", 3, "Image sitemaps: which tags does Google still support?", "Only `<image:image>` and `<image:loc>`", ["Every image tag, including caption and title", "None; image sitemaps were deprecated in 2022", "Only `<image:title>` and `<image:caption>`"], "Google simplified image sitemaps in 2022. Alt text and the surrounding content on the page matter more."],
["index", 3, "Your `rel=canonical` points to `/shoes`, but Google keeps choosing `/shoes?sort=price` as canonical. What most often overrides a canonical tag?", "Other signals, like internal links or sitemaps, pointing at the parameter URL", ["The clean URL's meta description is longer than the recommended length", "The page uses JSON-LD markup instead of the older microdata format", "The clean URL has a slower LCP than the parameter version"], "Canonical tags are one signal among several. Make internal links, sitemaps, redirects and hreflang all agree on the clean URL so the hint isn't outvoted."],
["index", 3, "A page sends `X-Robots-Tag: noindex` in the HTTP header and `<meta name=\"robots\" content=\"index\">` in the HTML. What does Google do?", "Follows the more restrictive one, so it isn't indexed", ["Follows the HTML tag, because it's more specific", "Follows whichever directive it happens to read last", "Ignores both conflicting directives and indexes it"], "When robots directives conflict, Google follows the most restrictive one. Audit both headers and HTML, especially when a CDN or server config adds headers you can't see in the source."],
["index",3,"What does the robots meta value `none` mean?","The same as `noindex, nofollow`",["The same as `index, follow`","No snippet, but still indexed","It's invalid and ignored"],"`none` is shorthand for `noindex, nofollow`. It's easy to misread as 'no restrictions', which makes it a classic audit catch."],
["crawl", 3, "robots.txt has one group for `User-agent: Googlebot` and another for `User-agent: *`. Which rules does Googlebot follow?", "Only the `Googlebot` group, because groups don't combine", ["Both groups, merged into one combined rule set", "Only the `*` group, because it applies to everyone", "Whichever of the two groups appears first in the file"], "A crawler obeys a single group. If you add a Googlebot-specific group, repeat every rule from `*` that should still apply to Googlebot."],
["crawl",3,"What does an empty `Disallow:` line (no path) under `User-agent: *` mean?","Nothing is disallowed — all URLs may be crawled",["Everything is blocked","Only the homepage is blocked","It's a syntax error, so the file is ignored"],"An empty Disallow value allows everything. Compare it with `Disallow: /`, which blocks the whole site; it's a one-character difference that matters a lot."],
["js", 3, "Does Googlebot keep cookies, localStorage and sessionStorage between page loads when it renders?", "No, each render starts fresh with that data cleared", ["Yes, for the whole of a crawl session", "Only cookies are kept, so logged-in content can be crawled", "Only localStorage is kept between page loads"], "Content that depends on a stored preference, a cookie wall or a returning-visitor state may never be seen by Googlebot. Make the default, stateless view contain your indexable content."],
["js", 3, "Your page asks for location permission before showing store results. How does Googlebot handle permission prompts?", "It declines them, so the page needs a fallback", ["It accepts every permission request automatically", "It waits for a timeout, then accepts the request", "It skips the page and moves on to the next URL"], "Googlebot declines permission requests such as geolocation or notifications. Use feature detection and render meaningful content when permission is denied."],
["status", 3, "Your server returns 403 to Googlebot on some URLs to 'slow it down'. What actually happens?", "They're treated as 'not found', can drop out, and crawling isn't slowed", ["Googlebot reads the 403s as a polite signal to crawl more slowly", "Google retries those URLs every hour until they return 200 again", "Nothing, because Google ignores 403 responses when it decides crawling"], "Only 429 and 5xx responses signal Googlebot to slow down. Other 4xx codes say the content doesn't exist, so misusing them can deindex pages."],
["status", 3, "Which 4xx status code does Googlebot treat as a signal to slow down, rather than as 'content doesn't exist'?", "429 Too Many Requests", ["404 Not Found", "410 Gone", "401 Unauthorized"], "429 is grouped with 5xx errors as a server-overload signal. Use it, or 503, briefly when you really need to reduce crawling."],
["cwv", 3, "A carousel loads five large images, but only the first is visible. Which attribute helps the browser prioritize correctly?", "`fetchpriority=\"low\"` on the hidden slides", ["`loading=\"eager\"` on every slide", "`decoding=\"sync\"` on every slide", "`rel=\"preload\"` for all five carousel images"], "Priority hints let the LCP image win the bandwidth race. Preloading or eager-loading everything just makes the images compete."],
["cwv", 3, "A click handler runs 400 ms of JavaScript before the UI updates, which hurts INP. What's the most effective fix?", "Break up the work and yield so the UI can paint first", ["Show a loading spinner once the work has finished", "Move the script into the `<head>` so it loads earlier", "Reduce TTFB so the handler starts running sooner"], "INP measures time to the next paint. Update the UI first, then do the heavy work in smaller chunks, for example with `scheduler.yield()` or `setTimeout`."],
["cwv", 3, "What does the CSS property `content-visibility: auto` do?", "Skips rendering off-screen content until it's needed", ["Hides the content from Googlebot but not from users", "Lazy-loads images, but has no effect on other content", "Prevents all layout shifts on the page automatically"], "It's a rendering optimization for long pages. Pair it with `contain-intrinsic-size` so placeholder sizes don't cause layout shifts while scrolling."],
["schema",3,"A product comes in several sizes and colors, each with its own URL. Which structured data pattern does Google support for this?","`ProductGroup` with `hasVariant` and `variesBy`",["One `Product` with every variant's price in `description`","A separate `Offer` with no `Product`","`ItemList` of `ListItem`s on each variant page"],"Variant markup groups related products and tells Google which properties change, such as size or color. Keep each variant's price and availability accurate."],
["schema", 3, "Your structured data has errors in the Rich Results Test. What's the consequence?", "The page just isn't eligible for those rich results", ["An automatic ranking demotion for the page until it's fixed", "The page is removed from Google's index", "A manual action is applied automatically"], "Invalid markup costs you rich results, not rankings. Manual actions are reserved for markup that misleads, such as fake reviews or hidden content."],
["intl", 3, "Some URLs in your hreflang cluster now 301 redirect after a migration. What's the risk?", "Google may ignore them; hreflang needs final, indexable URLs", ["None, because Google follows the redirects and applies hreflang anyway", "The redirecting URLs get a small ranking boost", "Google merges every language into one page"], "After a migration, update hreflang to the final URLs. Mismatched, redirected or non-canonical alternates are one of the most common causes of hreflang errors."],
["arch", 3, "You're moving the blog from `example.com/blog/` to `blog.example.com`. What's essential?", "Page-to-page 301s, and every internal signal updated", ["A single 301 from `/blog/` to the new subdomain's homepage", "Just adding the subdomain to Search Console", "Both versions live, with noindex on the old one"], "Every old URL needs a one-to-one redirect, and every internal signal should point to the new URLs. Then monitor indexing and crawl stats for both hosts."],
["logs", 3, "Logs show Googlebot re-downloading your JS and CSS files often. What reduces this most reliably?", "Content-fingerprinted file names, such as `app.3f9a1c.js`", ["Blocking all JS and CSS files in robots.txt", "Short cache lifetimes so files are always fresh", "Inlining every script and stylesheet directly into the HTML"], "Google's renderer caches resources aggressively and may ignore cache headers. Versioned file names let it reuse what hasn't changed and fetch only what has."],
["gsc", 3, "In the Performance report, the per-query table adds up to fewer clicks than the chart total. Why?", "Anonymized queries are left out of the query table", ["The chart total includes your paid ad clicks", "It's a known data-processing bug in Search Console", "Image clicks are counted twice in the chart"], "Expect a gap, often a large one for long-tail sites. Use page-level data or the BigQuery bulk export for fuller analysis."],
["gsc", 3, "Clicks went up month over month, but average position got worse. What's the most likely explanation?", "You started appearing for more queries at lower positions", ["Your rankings fell for almost every query you track", "Search Console is reporting the position data incorrectly", "Google stopped counting mobile impressions in the report"], "Average position is impression-weighted. New long-tail visibility at positions 20 to 50 can lower the average while bringing in more clicks overall. Segment by query or page before drawing conclusions."],
["gsc", 3, "URL Inspection's live test shows your fix, but the 'Google index' tab still shows the old version. Why?", "The index tab shows the last crawl, not the live page", ["The fix didn't actually deploy to production", "The live test uses a different Googlebot user agent", "The page is blocked by robots.txt for indexing"], "Live test confirms that Google can see the fix. Request indexing for important pages, then check the indexed version after the next crawl."],
["onpage", 3, "Which statement about E-E-A-T is accurate?", "It's a rater-guidelines framework, not a single ranking factor", ["It's a numeric score Google calculates for every page it indexes", "It only applies to health and finance (YMYL) sites, nowhere else", "Adding author schema to a page is enough to guarantee it"], "Raters use E-E-A-T to evaluate results, and their feedback helps Google check its systems. Real experience, credible authorship and trustworthy sites are what the signals reward."],
["onpage", 3, "What's Google's position on AI-generated content?", "Helpful is fine; mass-producing content to manipulate rankings is spam", ["All AI-generated content is penalized once Google's systems detect it", "AI content must carry a visible label before it can rank", "AI-written pages can't be used as sources in AI Overviews"], "The scaled content abuse policy targets the purpose and the result, not the tool. Human editing, original insight and accuracy are what keep AI-assisted content safe."],
["local", 3, "A business has three branches. How should the site and structured data be set up?", "A separate page per branch, each with its own `LocalBusiness` markup", ["One page listing all three addresses in one `LocalBusiness` block", "Markup for the head office only, with the branches in plain text", "Three Business Profiles, all linking to the same homepage"], "One location per page, with consistent NAP and matching Business Profiles, gives Google a clear entity for each branch."],
["local", 3, "What makes an ecommerce product page eligible for merchant listing experiences in organic results?", "`Product` markup with an `Offer`, or a Merchant Center feed", ["Review stars on the page, with or without a price", "An FAQ section answering shipping and returns questions", "A breadcrumb trail showing the product's category"], "Merchant listings need commercial data. Keep the markup and the feed consistent with what the page shows, or listings get disapproved."],
["mobile", 3, "Does Google index content inside an `<iframe>` as part of the parent page?", "Sometimes, but it isn't guaranteed", ["Always, exactly like inline content", "Never, under any circumstances", "Only if the iframe is on the same domain"], "Keep content that needs to rank in the page's own HTML. Treat iframed content as a bonus at best."],
["sitemap", 3, "Can a sitemap hosted on `cdn.example.com` list URLs for `www.example.com`?", "Yes, once ownership of both hosts is proven", ["No, a sitemap can only list its own host", "Yes, without any extra setup at all", "Only for image sitemaps, not page sitemaps"], "Cross-site sitemap submission is allowed once ownership is proven. It's useful when sitemaps are generated and hosted somewhere else."],
/* ---- Level expansion (Nov 2026): Junior easy / Mid medium / Senior hard ---- */
["crawl", 1, "What's the difference between crawling and indexing?", "Crawling fetches a page; indexing stores it for results", ["They're two names for exactly the same step", "Indexing happens first, and crawling comes after", "Crawling decides rankings; indexing sets the title"], "A page can be crawled but not indexed. When a page is missing from Google, ask which step failed: was it fetched, and then was it chosen for the index?"],
["crawl", 1, "How does Google usually find a brand-new page?", "By following links, and from XML sitemaps", ["Only when you submit it in Search Console", "Automatically, the moment it's published", "Through the Google Analytics tag on the page"], "Links are Google's main discovery route. A new page with no internal links and no sitemap entry can go unnoticed for a long time."],
["index", 1, "Your new blog post isn't showing in Google after two days. What's a sensible first step?", "Check URL Inspection, and that it's linked and in the sitemap", ["Rewrite the whole post so it looks more original to Google", "Delete it and publish it again under a brand-new URL", "Buy backlinks to it so Google notices the page sooner"], "Diagnose before you change anything. URL Inspection shows whether Google knows about the page, whether it can crawl it and whether anything blocks indexing."],
["index", 1, "What is 'duplicate content' usually, in practice?", "The same content at several URLs; Google just picks one", ["A penalty for copying text from another website", "Any page that's longer than 1,000 words of text", "Two pages on your site that use the same keyword, even just once"], "Most duplication is technical. Your job is to help Google pick the right version with redirects, canonicals and consistent internal links."],
["index", 1, "What's the most reliable way to see how many of a site's pages Google has indexed?", "Search Console's Pages report", ["Counting the results of a `site:` search", "Checking which URLs robots.txt allows", "Looking at sessions in Google Analytics"], "`site:` results are estimates and change a lot. The Pages report shows indexed and not-indexed counts, plus the reasons."],
["status", 1, "Is a 404 'Not found' error bad for SEO?", "Not in itself; fix only the ones with links or traffic", ["Yes, every 404 lowers the whole site's rankings a little more", "Yes, Google penalizes sites with more than ten", "Only on mobile, where errors count more heavily"], "Google expects 404s. Prioritise the ones linked from your own pages or from other sites, because those waste visitors and link value."],
["status", 1, "A product has moved permanently to a new URL. Which redirect should you use?", "A 301 (permanent) redirect", ["A 302 (temporary) redirect", "A meta refresh after 10 seconds", "No redirect, just a link on the old page"], "A 301 tells browsers and Google the move is permanent, so signals move to the new URL. Save 302s for genuinely temporary moves."],
["status", 1, "What's a redirect chain, and how do you fix it?", "A redirects to B, then to C; point A straight at C", ["A redirect to the homepage; remove it and use a 404", "A 404 page with no content; add text to it", "A page with two canonicals; delete one of them"], "Chains slow users down and waste crawling. After migrations, re-crawl your redirects and collapse them into single hops."],
["cwv", 1, "What does Largest Contentful Paint (LCP) measure?", "When the largest image or text block on screen appears", ["How long the whole page takes to download completely", "How quickly the page responds when someone clicks", "How much the layout moves while the page is loading"], "LCP is about when a page looks loaded to a person. The LCP element is often a hero image or a headline."],
["cwv", 1, "Why do Core Web Vitals focus on data from real users rather than one lab test?", "Real devices and networks vary, so field data shows the real experience", ["Google's guidelines don't allow lab test results to be used for ranking", "Real users always load pages faster than lab tests do", "Lab tests can't measure LCP, only CLS and INP"], "A page can score 100 in a lab test on a fast laptop and still be slow for people on mid-range phones. Use lab tools to debug and field data to judge."],
["cwv", 1, "Which free tool shows both real-user data and lab diagnostics for a single URL?", "PageSpeed Insights", ["Google Trends", "Google Tag Manager", "Search Console's Links report"], "PageSpeed Insights shows CrUX field data at the top and a Lighthouse lab run underneath, with specific fixes to try."],
["schema", 1, "What is structured data?", "Code, usually JSON-LD, that labels what's on a page", ["A list of keywords hidden in the page for crawlers", "The page's HTML heading structure (H1 to H6)", "A special kind of XML sitemap for images"], "Structured data doesn't change what users see. It describes the content in a standard vocabulary (schema.org), which can make the page eligible for rich results."],
["schema", 1, "Which of these is a rich result that structured data can make a page eligible for?", "Star ratings and price shown under a product result", ["A paid ad at the top of the page", "Your result's position number", "The autocomplete suggestions in the search box"], "Rich results add extra details to a normal result. They often improve click-through rate even when the ranking doesn't change."],
["sitemap", 1, "Does adding a page to the XML sitemap guarantee it gets indexed?", "No, it helps discovery, but Google still decides", ["Yes, every listed page is indexed within 24 hours", "Yes, once the sitemap is submitted in Search Console", "Only for pages that include an accurate lastmod date"], "A sitemap is a discovery hint. Quality, duplication and technical blocks still decide indexing."],
["sitemap", 1, "How do you tell Google where your sitemap is?", "Submit it in Search Console and add a `Sitemap:` line to robots.txt", ["Email the sitemap URL to Google's webmaster support team", "Link to the sitemap from the footer on every page of the site", "Add the sitemap URL to your Google Analytics property settings"], "Doing both means Google and other search engines can find it, and Search Console then reports how many of its URLs are indexed."],
["arch", 1, "Why do internal links matter for SEO?", "They help Google find pages and understand which ones matter", ["They don't; only links from other websites help pages rank", "They're only for users and have no effect on SEO", "They only count when they're in the main menu"], "Linking from strong, relevant pages to a page you want to rank is one of the cheapest SEO wins you control."],
["arch", 1, "What does a breadcrumb trail like 'Home › Shoes › Running' do?", "Shows where the page sits in the site, with helpful links", ["Tracks how visitors move around the site for analytics", "Speeds up loading by preloading the parent pages", "Replaces the need for an XML sitemap on the site"], "Breadcrumbs reinforce the site hierarchy and help users move back up a level. They can be marked up with BreadcrumbList structured data too."],
["gsc", 1, "In Search Console, what's the difference between CTR and average position?", "CTR is clicks divided by impressions; position is average ranking", ["They're the same metric, just shown in two different formats in the report", "CTR is the share of clicks that came from your ads", "Position is the number of clicks a page received"], "A drop in CTR with a steady position often means the result looks less appealing, or a SERP feature is taking attention. A drop in position is a ranking change."],
["gsc", 1, "A page gets many impressions but a very low CTR. What's often worth testing first?", "A clearer title and description that match the search", ["Deleting the page and starting again with a new URL", "Adding more of the target keywords into the URL", "Blocking it in robots.txt so another page ranks"], "Impressions mean Google already shows the page. Better titles and descriptions turn more of those views into visits."],
["gsc", 1, "Who should get 'Owner' permission in Search Console?", "Only the few people who manage access and settings", ["Everyone on the team, so nobody gets blocked", "Anyone who asks, because permissions are harmless", "Only external agencies that work on the site"], "Owners can add and remove users and change settings. Limit Owner access to protect the property and keep track of who did what."],
["gsc", 1, "Search Console reports a 'manual action'. What does that mean?", "A Google reviewer found a policy violation affecting your pages", ["Google's algorithm made a normal ranking change to the site", "Your XML sitemap failed to load the last time Google tried", "Your site was moved over to mobile-first indexing"], "Manual actions show up in the Security & Manual Actions section. Fix the issue across the site, then submit a reconsideration request explaining what you changed."],
["mobile", 1, "What does mobile-first indexing mean?", "Google mainly uses the mobile version for indexing and ranking", ["Sites with a mobile version always rank above desktop-only sites", "Google now only shows search results on mobile phones", "Desktop pages are no longer indexed by Google at all"], "Whatever is missing from your mobile version (content, links, structured data) is effectively missing for Google too."],
["mobile", 1, "Google's Mobile-Friendly Test has been retired. What can you use instead to check a page on mobile?", "Lighthouse in Chrome DevTools, with device emulation", ["Search Console's Crawl Stats report, filtered to smartphone", "Google Trends' device breakdown", "Search Console's Links report"], "Lighthouse and DevTools device mode show layout, tap-target and viewport problems. Real-device checks are still worth doing for key templates."],
["onpage", 1, "What is search intent?", "The goal behind a search, such as learning or buying", ["How many times a keyword is searched each month in Google", "The keyword's difficulty score in SEO tools", "The order the words are typed in the query"], "Look at what already ranks to see which type of page Google thinks fits, whether that's a guide, a product page or a comparison, and match it."],
["onpage", 1, "What's keyword stuffing, and why avoid it?", "Repeating keywords unnaturally, which breaks spam policies", ["Using the main keyword once in the page's title tag", "Researching keywords before you start writing a page's content", "Adding synonyms and related terms throughout a page"], "Write for people. Google understands synonyms and related terms, so natural, specific language works better than repetition."],
["onpage", 1, "Where should a page's main topic appear for the clearest signal?", "The title tag, the H1 and the opening paragraph", ["Only the meta keywords tag in the page's head", "White text at the bottom of the page", "Only the file names of the images"], "These are the places users and search engines look first to understand a page."],
["onpage", 1, "What is 'thin content'?", "Pages that add little unique value", ["Any page with fewer than 300 words", "Pages that contain only one image", "Pages without a meta description"], "Length isn't the issue; usefulness is. A short page that fully answers the question isn't thin."],
["local", 1, "What is a Google Business Profile?", "A free listing that controls how a business shows in Maps", ["A paid Google Ads campaign that promotes local businesses in Maps", "A business's company page on LinkedIn", "A section of Google Analytics for local data"], "Accurate categories, hours, photos and reviews in the profile are among the strongest levers for local visibility."],
["local", 1, "A customer leaves a negative review on your Business Profile. What's best practice?", "Reply politely and helpfully, and fix the issue if you can", ["Ignore it, because replying only draws attention to it", "Ask friends to post positive reviews to balance it out", "Report every negative review to Google as spam"], "Responses show future customers that you care. Fake reviews break Google's policies and can get the profile restricted."],
["local", 1, "What helps an ecommerce category page rank?", "A helpful intro, clear product links and a matching title", ["Hidden text at the bottom stuffed with keywords", "A noindex tag so the products rank instead", "500 products listed on one page, with no other content or links"], "Category pages often target the most valuable commercial searches. Treat them as real landing pages, not just product grids."],
["js", 1, "Why can 'View page source' and 'Inspect element' show different content?", "Source is the raw server HTML; Inspect shows it after JavaScript", ["They always show exactly the same content and code", "Inspect element only shows the page's CSS styles", "View source shows exactly the version of the page that Google ranks"], "If important content only appears in Inspect, it depends on JavaScript, so check that Google can render it with URL Inspection."],
["ai", 1, "What are Google's AI Overviews?", "AI summaries at the top of some results, with source links", ["A paid ad format that appears above normal results", "A Search Console report on AI traffic to your site", "Google's new name for featured snippets at the top of the results"], "Being one of the linked sources can still bring visits, and the same SEO fundamentals help you get there."],
["ai", 1, "Do normal SEO fundamentals help you appear as a source in AI Overviews?", "Yes, because AI Overviews draw on Google's index", ["No, AI Overviews ignore Google's index completely", "Only if you pay Google for placement in them", "Only once you add special AI markup to pages"], "Google says there's no special markup for AI features. Being indexed, eligible for snippets and genuinely helpful is the path."],
["logs", 1, "What does a line in a server access log usually record?", "IP, time, requested URL, status code and user agent", ["The visitor's search query that led to the page", "How long the visitor spent on each page", "The keyword ranking that sent the visit"], "Logs show what bots and users actually requested and what your server returned. That's the raw data behind crawl analysis."],
["intl", 1, "What does hreflang do?", "Tells Google which language or regional version to show", ["Translates your page into other languages automatically", "Boosts the page's rankings in every country it lists", "Sets the character encoding the browser should use"], "hreflang doesn't make a page rank better. It swaps in the right version, for example showing the UK page to UK searchers."],
["crawl", 2, "How do you check whether robots.txt blocks a specific URL now that the old robots.txt Tester is gone?", "URL Inspection, plus the robots.txt report", ["The Rich Results Test, which checks robots rules", "Google Analytics' real-time report", "PageSpeed Insights' crawlability audit"], "The robots.txt report shows which version Google fetched and any errors. URL Inspection tells you whether a particular URL is blocked."],
["crawl", 2, "`/cart/` URLs show as 'Indexed, though blocked by robots.txt'. You want them out of Google. What works?", "Allow crawling for a while and add `noindex`", ["Add more Disallow rules for the cart URLs", "Remove the cart URLs from the sitemap only", "Use the Removals tool once and leave it there"], "Google can't see a noindex on a page it isn't allowed to crawl. Once the URLs have dropped out, you can decide whether to block crawling again."],
["crawl", 2, "Which Googlebot crawls most sites today?", "Googlebot Smartphone", ["Googlebot Desktop", "Googlebot-Image", "AdsBot"], "With mobile-first indexing, the smartphone crawler does most of the work. When you segment logs, expect most Googlebot hits to be the mobile user agent."],
["index", 2, "A staging site, `staging.example.com`, has ended up in Google. What's the most reliable way to stop this happening?", "Put staging behind a login (HTTP authentication)", ["Add `Disallow: /` to robots.txt only", "Don't link to it from anywhere", "Add it to the sitemap with a low priority"], "Password protection keeps out every crawler. A robots.txt block doesn't stop indexing of linked URLs, and the rule tends to get copied to production by accident."],
["index", 2, "The Pages report lists URLs as 'Page with redirect'. What should you do?", "Usually nothing, because redirects aren't indexed by design", ["Remove the redirects so the old URLs can be indexed again instead", "Request indexing for each URL in URL Inspection", "Add canonical tags pointing the URLs to themselves"], "This status is expected after migrations. It only matters if important pages are wrongly redirecting, or your own links keep pointing at old URLs."],
["index", 2, "Search Console shows 'Alternate page with proper canonical tag'. What does it mean?", "Google followed your canonical to another URL, as intended", ["The page has received a penalty from Google", "Your canonical tag is broken and Google couldn't read it at all", "Google couldn't crawl the page to check it"], "This is usually a good sign: parameter and duplicate URLs are being consolidated. Check the list only for pages you actually want indexed."],
["index", 2, "Your paginated category pages from page 2 onward are set to `noindex`. What's the risk?", "Products linked only from deep pages may be found less", ["Page 1 of the category gets a ranking penalty", "Nothing, because noindex has no effect on crawling", "Google merges every paginated page into page 1"], "Indexable, self-canonical pagination with plain links is the safer default for helping Google reach every product."],
["status", 2, "After a site migration, how long should you keep the 301 redirects in place?", "As long as possible: at least a year, ideally forever", ["One week, until Google has seen the new URLs", "Until Google has recrawled the homepage once", "Until the new pages show as indexed in Search Console"], "Old URLs stay in bookmarks, backlinks and Google's memory for years. Removing redirects early throws away link equity and creates 404s."],
["status", 2, "You're mapping 5,000 old URLs for a migration. What's the best approach?", "Map each old URL to its closest equivalent, and 404 the rest", ["Redirect every old URL to the new homepage", "Redirect every old URL to its nearest category page to keep things simple", "Redirect only the top 100 pages by traffic"], "One-to-one mapping keeps relevance and signals. Prioritise URLs with traffic and backlinks, then test the redirect map before launch."],
["js", 2, "In a single-page app, every route shows the same title and meta description in Google. What's wrong?", "The title, description and canonical don't update per route", ["Google doesn't support single-page apps, so it indexes only the shell", "The site is missing an XML sitemap for the routes", "The server responds too slowly for Google to render"], "Each view needs its own head tags, set on navigation (or better, rendered on the server). Otherwise Google sees one generic page many times over."],
["js", 2, "Why do single-page apps often produce soft 404s?", "The server returns 200 for every URL, even routes that don't exist", ["Single-page apps can't be served over HTTPS", "Google doesn't render JavaScript on single-page apps", "Most routers add a noindex tag to every route by default automatically"], "Fix it by returning a real 404 from the server for unknown routes, or by redirecting to a URL that does return 404. Adding noindex to the 'not found' view also works."],
["cwv", 2, "Time to First Byte is high on uncached pages. Which fixes help most?", "Caching, a CDN and a faster backend", ["Compressing and resizing the page's images", "Adding more structured data to the page", "Lazy-loading the hero image below the fold"], "TTFB comes before every other metric. If the HTML is slow to arrive, LCP can't be good."],

["logs", 2, "What's a useful way to check whether Googlebot spends its time on your important pages?", "Group Googlebot hits by section and compare with their value", ["Count the total number of Googlebot hits per day and look for growth", "Compare the bounce rate of each section in GA4", "Check each section's rankings in a rank tracker"], "If half of Googlebot's requests go to filters or parameters while key categories are rarely crawled, you've found a crawl-efficiency problem."],

["onpage", 2, "Is it worth changing an article's published date without meaningfully updating it?", "No, it can mislead users and won't help", ["Yes, fresh dates always rank higher in Google", "Yes, ideally once a week for every article", "Only for evergreen content, not for news"], "Update the date when you make substantial changes, and show it clearly. Faking freshness is a short-term trick that undermines trust."],

["crawl", 3, "What sets Googlebot's crawl capacity for your site now that Search Console's crawl-rate setting is gone?", "Mainly how fast and reliably your server responds", ["How many backlinks point to your site from other domains", "How many URLs your XML sitemaps contain", "How long your domain has been registered"], "Google retired the manual crawl-rate limiter in 2024. Fast, error-free responses raise capacity, and slow responses or 5xx errors lower it."],

["status", 3, "You've served 410s for a deleted section for months, but Googlebot still requests those URLs now and then. Is something wrong?", "No, occasional rechecks of known URLs are normal", ["Yes, the 410 responses aren't being understood", "Yes, you need to disallow them in robots.txt now", "Yes, Google will penalize the site for the errors"], "Occasional recrawls of removed URLs are normal and cost little. Only act if they're still in sitemaps or internal links."],

const QUIZABLE = i => !!(BANK[i] && CATS[BANK[i][0]]);   // news questions are excluded from all quizzes

function dateKey(d=new Date(Date.now()+DAY_OFFSET*864e5)){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(k,n){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
function hash(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; }; }
function rng(seed){ let a=hash(seed)(); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>"); }
const DIFF = {1:"Easy",2:"Medium",3:"Hard"}, XP = {1:10,2:20,3:30};
const RANKS = [[0,"Intern"],[200,"Junior SEO"],[600,"SEO Specialist"],[1300,"Senior SEO"],[2500,"Technical SEO Lead"],[4500,"Crawl Whisperer"]];
function rankOf(xp){ let r=RANKS[0],n=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){ r=RANKS[i]; n=RANKS[i+1]||null; } } return {r,n}; }
function catAcc(c){ const v=S.cat[c]; return v&&v[1] ? v[0]/v[1] : null; }

/* ---------- Daily set generation ----------
   10 questions: up to 2 you previously missed (spaced review), weighted toward your weakest
   categories and least-seen questions, with a 5 easy / 4 medium / 1 hard mix. */
function buildDaily(key){
  const r = rng("crawldaily|"+key+"|"+(S.level||"junior"));
  const ids = [];
  const review = Object.keys(S.missed).map(Number).filter(id => S.missed[id] < key && inLevel(id));
  const targets = {...lvl().mix};
  for (const id of shuffle(review, r)) {
    if (ids.length >= 2) break;
    const d = BANK[id][1];
    if (targets[d] > 0) { ids.push(id); targets[d]--; }
  }
  const weight = id => {
    const c = BANK[id][0], acc = catAcc(c), seen = S.seen[id]||0;
    return (1/(1+seen*1.5)) * (acc===null ? 1.2 : 1.6-acc) * (0.5+r());
  };
  const usedCats = {};
  for (const d of [1,2,3]) {
    let pool = BANK.map((_,i)=>i).filter(i => QUIZABLE(i) && BANK[i][1]===d && !ids.includes(i));
    pool.sort((a,b)=>weight(b)-weight(a));
    for (const id of pool) {
      if (targets[d]<=0) break;
      const c = BANK[id][0];
      if (c==="news" || (usedCats[c]||0) >= 2) continue;
      ids.push(id); usedCats[c]=(usedCats[c]||0)+1; targets[d]--;
    }
  }
  if (ids.length < 10) {
    const rest = BANK.map((_,i)=>i).filter(i => inLevel(i) && !ids.includes(i)).sort((a,b)=>weight(b)-weight(a));
    for (const id of rest) { if (ids.length >= 10) break; ids.push(id); }
  }
  return shuffle(ids, r).sort((a,b)=>BANK[a][1]-BANK[b][1]);
}
function ensureDaily(){
  const k = dateKey();
  if (!S.daily || S.daily.date !== k || (!S.daily.answers.length && !S.daily.ids.every(i=>inLevel(i)))) { S.daily = { date:k, ids:buildDaily(k), answers:[], done:false }; save(); }
  return S.daily;
}
function optionOrder(id, salt){
  const q = BANK[id]; const opts = [q[3], ...q[4]];
  return shuffle(opts.map((t,i)=>({t, ok:i===0})), rng(salt+"|"+id));
}

let cdTimer;
function tick(){ clearInterval(cdTimer); const f=()=>{ const el=$("#cd"); if(!el) return clearInterval(cdTimer); const now=new Date(), m=new Date(now); m.setHours(24,0,0,0); const s=Math.floor((m-now)/1000); el.textContent=`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`; if(s<=0){clearInterval(cdTimer);home();} }; f(); cdTimer=setInterval(f,30000); }

/* ---------- Quiz engine ---------- */
let RUN = null; // {mode, ids, answers, salt}
function startDaily(){ const d=ensureDaily(); RUN={mode:"daily",ids:d.ids,answers:d.answers,salt:d.date}; question(); }
function startPractice(){
  const sel=$("#pcat").value, r=rng("p"+Date.now()+Math.random());
  let pool=BANK.map((_,i)=>i).filter(i=>inLevel(i));
  if(sel==="__review") pool=Object.keys(S.missed).map(Number).filter(i=>inLevel(i));
  else if(sel==="__weak"){ const t=Object.keys(CATS).filter(c=>S.cat[c]&&S.cat[c][1]).sort((a,b)=>catAcc(a)-catAcc(b))[0]; pool=pool.filter(i=>BANK[i][0]===t); }
  else if(sel) pool=pool.filter(i=>BANK[i][0]===sel);
  const ids=shuffle(pool,r).slice(0,10).sort((a,b)=>BANK[a][1]-BANK[b][1]);
  RUN={mode:"practice",ids,answers:[],salt:"p"+Date.now()}; question();
}
function question(){
  VIEW="quiz"; app.className="narrow"; document.getElementById("hdr").className="narrow";
  const i=RUN.answers.length; if(i>=RUN.ids.length) return finish();
  const id=RUN.ids[i], q=BANK[id], opts=optionOrder(id,RUN.salt);
  const isReview = RUN.mode==="daily" && S.missed[id]!==undefined;
  app.innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="meta">${RUN.mode==="daily"?"Daily":"Practice"} · ${i+1} / ${RUN.ids.length}</span><button class="btn ghost" style="padding:6px 12px;font-size:13px" onclick="home()">Exit</button></div>
    <div class="progress"><div style="width:${i/RUN.ids.length*100}%"></div></div>
    <div class="card">
      <div class="tags"><span class="tag">${CATS[q[0]]||"SEO news"}</span><span class="tag d${q[1]}">${DIFF[q[1]]} · ${XP[q[1]]}xp</span>${isReview?'<span class="tag rev">Review</span>':""}</div>
      <div class="q">${fmt(q[2])}</div>
      <div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${fmt(o.t)}</span></button>`).join("")}</div>
      <div id="after"></div>
    </div>`;
  const btns=[...document.querySelectorAll(".opt")];
  let sel=-1;
  const choose=j=>{
    if(btns[0].disabled) return;
    sel=j; btns.forEach((b,k)=>b.classList.toggle("sel",k===j));
    $("#after").innerHTML=`<div class="confirm"><span>Lock in answer <b>${"ABCD"[j]}</b>? Are you sure?</span><button class="btn ghost" id="chg">Change</button><button class="btn" id="lock">Yes, lock it in</button></div>`;
    $("#chg").onclick=()=>{ sel=-1; btns.forEach(b=>b.classList.remove("sel")); $("#after").innerHTML=""; };
    $("#lock").onclick=()=>pick(sel); $("#lock").focus();
  };
  const pick=j=>{
    if(btns[0].disabled||j<0) return;
    btns.forEach(b=>{ b.disabled=true; b.classList.remove("sel"); });
    const ok=opts[j].ok;
    btns.forEach((b,k)=>{ if(opts[k].ok) b.classList.add("right"); else if(k===j) b.classList.add("wrong"); });
    record(id,ok);
    RUN.answers.push(ok?1:0); if(RUN.mode==="daily"){ S.daily.answers=RUN.answers; } save();
    const last=RUN.answers.length>=RUN.ids.length;
    $("#after").innerHTML=`<div class="explain ${ok?"":"bad"}"><strong>${ok?"Correct — +"+(RUN.mode==="daily"?XP[q[1]]:XP[q[1]]/2)+" XP":"Not quite"}</strong>${fmt(q[5])}</div>
      <div class="foot"><span class="note">Press Enter to continue</span><button class="btn" id="next">${last?"See results":"Next question"} →</button></div>`;
    $("#next").onclick=question; $("#next").focus();
  };
  btns.forEach((b,j)=>b.onclick=()=>choose(j));
  document.onkeydown=e=>{
    if(btns[0].disabled) return;
    if(e.key==="Enter"&&sel>-1){ e.preventDefault(); pick(sel); return; }
    if(e.key==="Escape"&&sel>-1){ $("#chg").click(); return; }
    const n="1234abcd".indexOf(e.key.toLowerCase()); if(n>-1&&n%4<btns.length) choose(n%4);
  };
}
function record(id,ok){
  const q=BANK[id], c=q[0];
  S.cat[c]=S.cat[c]||[0,0]; S.cat[c][1]++; if(ok) S.cat[c][0]++;
  S.seen[id]=(S.seen[id]||0)+1;
  if(ok){ S.xp+=RUN.mode==="daily"?XP[q[1]]:XP[q[1]]/2; delete S.missed[id]; }
  else S.missed[id]=dateKey();
}
function finish(){
  document.onkeydown=null;
  if(RUN.mode==="daily" && !S.daily.done){
    const k=S.daily.date, score=RUN.answers.reduce((a,b)=>a+b,0);
    S.daily.done=true; S.history[k]=score;
    S.streak = S.lastDaily===addDays(k,-1) ? S.streak+1 : (S.lastDaily===k ? S.streak : 1);
    S.lastDaily=k; S.bestStreak=Math.max(S.bestStreak,S.streak);
    if(score===10) S.xp+=50;
    save();
  }
  pushScore();
  results();
}

}

const SHEET_URL = "https://script.google.com/macros/s/AKfycbwny_kai6IqjBCpYHqAcKhiFXxWcN4pnrcJFh91ezSI4r4Nl_Dw5VwwjMyEcBh4RMlY/exec";
let BOARD=[], BOARD_STATE="loading", BOARD_TAB="week", VIEW="home", SEASON_SEEN=false;
let writeChain=Promise.resolve(), lastPushed="", pollTimer=null;
const num=(v,max=1e7)=>{ const n=Number(v); return Number.isFinite(n)&&n>=0 ? Math.min(n,max) : 0; };
function weekStartKey(k){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()-((dt.getDay()+6)%7)); return dateKey(dt); }
function recentHistory(){ const k=dateKey(), out={}; for(let i=0;i<14;i++){ const dk=addDays(k,-i); if(S.history[dk]!=null) out[dk]=S.history[dk]; } return out; }
function newId(){ const a=new Uint8Array(12); try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<12;i++) a[i]=Math.random()*256|0; } return Array.from(a,b=>b.toString(16).padStart(2,"0")).join(""); }
function pushScore(){
  if(TEST) return;
  if(!SHEET_URL||!S.pid||!S.name||!SEASON_SEEN) return;
  const row={board:TEST?"test":"", id:S.pid, name:S.name, xp:S.xp, streak:S.streak, bestStreak:S.bestStreak, lastDaily:S.lastDaily||"", recent:recentHistory(), season:S.season||""};
  const sig=JSON.stringify(row); if(sig===lastPushed) return; lastPushed=sig;

}
function setTab(t){ BOARD_TAB=t; document.querySelectorAll(".board-tabs button").forEach((b,i)=>b.classList.toggle("on",["today","week","xp","streak"][i]===t)); renderBoard(); }
function boardRows(){
  const today=dateKey(), yest=addDays(today,-1), ws=weekStartKey(today);
  return BOARD.map(r=>{
    const recent=(r.recent&&typeof r.recent==="object")?r.recent:{};
    const live=(r.lastDaily===today||r.lastDaily===yest)?num(r.streak,5000):0;
    let week=0; for(const [d,v] of Object.entries(recent)) if(d>=ws&&d<=today) week+=num(v,10);
    const val={today:recent[today]!=null?num(recent[today],10):null, week, xp:num(r.xp), streak:live}[BOARD_TAB];
    return {id:String(r.id), name:String(r.name||"").slice(0,30), val, xp:num(r.xp)};
  }).filter(r=>r.val!==null && r.val>0).sort((a,b)=>b.val-a.val||b.xp-a.xp).slice(0,25);
}
function renderBoard(){
  const el=document.getElementById("board"); if(!el) return;
  const live=document.getElementById("board-live");
  if(!SHEET_URL){ el.innerHTML='<p class="note">The team leaderboard isn\'t connected yet.</p>'; return; }
  if(BOARD_STATE==="needs-script"){ el.innerHTML='<p class="note">Test leaderboard is off: update the Google Sheet script to the version with test-board support, then refresh.</p>'; return; }
  if(BOARD_STATE==="loading"&&!BOARD.length){ el.innerHTML='<p class="note">Loading leaderboard…</p>'; return; }
  if(BOARD_STATE==="error"&&!BOARD.length){ el.innerHTML='<p class="note">Can\'t reach the leaderboard right now. Your progress is still saved in this browser.</p>'; return; }
  const rows=boardRows();
  if(live) live.textContent = BOARD.length ? `${BOARD.length} player${BOARD.length===1?"":"s"}` : "";
  el.innerHTML="";
  const unit={today:"/10",week:" pts",xp:" XP",streak:" 🔥"}[BOARD_TAB];
  const empty={today:"Nobody has finished today's quiz yet. Be the first.",week:"No scores yet this week.",xp:"No players yet.",streak:"No active streaks right now."}[BOARD_TAB];
  if(!rows.length){ const p=document.createElement("p"); p.className="note"; p.textContent=empty; el.appendChild(p); }
  else {
    const list=document.createElement("div"); list.className="lb";
    rows.forEach((r,i)=>{
      const me=r.id===S.pid;
      const row=document.createElement("div"); row.className="lb-row"+(me?" me":"");
      const pos=document.createElement("span"); pos.className="pos"+(i<3?" top":""); pos.textContent=i<3?["🥇","🥈","🥉"][i]:String(i+1);
      const av=document.createElement("span"); av.className="av"; av.textContent=(r.name.trim()[0]||"?").toUpperCase(); av.style.background=`hsl(${[...r.id].reduce((h,c)=>h*31+c.charCodeAt(0)>>>0,7)%360} 45% 45%)`;
      const nm=document.createElement("span"); nm.className="nm"; nm.textContent=r.name||"Player";
      if(me){ const y=document.createElement("small"); y.textContent="you"; nm.appendChild(y); }
      const val=document.createElement("span"); val.className="val"; val.textContent=r.val+unit;
      row.append(pos,av,nm,val); list.appendChild(row);
    });
    el.appendChild(list);
  }
  const note=document.createElement("p"); note.className="note"; note.style.marginTop="10px";
  note.textContent="Your score posts when you finish a quiz. Weekly totals reset every Monday.";
  el.appendChild(note);
}
async function loadBoard(){
  if(TEST) return;
  if(!SHEET_URL) return;
  try{
    const r=await fetch(SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+(TEST?"board=test&":"")+"t="+Date.now());
    const j=await r.json();
    if(TEST && j.board!=="test"){ BOARD=[]; BOARD_STATE="needs-script"; renderBoard(); return; }  // old Sheet script: never write test data to the real board
    BOARD=Array.isArray(j.rows)?j.rows:[]; BOARD_STATE="ok";
    // Season: running resetLeaderboard() in the Sheet's script starts a new season, which wipes everyone's progress.
    const season=typeof j.season==="string"?j.season.slice(0,64):"";
    if(!SEASON_SEEN){ SEASON_SEEN=true;
      if((S.season||"")!==season){
        if(S.season!==undefined||season!==""){ /* a reset happened since this browser last synced: wipe */ S={xp:0,streak:0,bestStreak:0,lastDaily:null,history:{},cat:{},seen:{},missed:{},daily:null,name:S.name,pid:S.pid,level:S.level}; if(RUN&&RUN.mode==="daily") RUN=null; }
        S.season=season; save(); if(VIEW==="home") home();
      }
      pushScore();
    }
  }catch(e){ BOARD_STATE="error"; }
  renderBoard();
}
function initBoard(){
  if(TEST) return;
  if(!SHEET_URL){ renderBoard(); return; }
  loadBoard();
  clearInterval(pollTimer); pollTimer=setInterval(()=>{ if(!document.hidden&&VIEW==="home") loadBoard(); },60000);
}

/* ---------- Test tools (only on /test/) ---------- */
function testTools(){
  const el=document.getElementById("testbar"); if(!TEST||!el) return;
  if(!document.title.startsWith("TEST")) document.title="TEST · "+document.title;
  el.innerHTML=`<b>TEST</b><span>Your team can't see this copy. Progress is separate and there's no leaderboard. Pretend date: <strong>${dateKey()}</strong>${DAY_OFFSET?` (+${DAY_OFFSET} day${DAY_OFFSET===1?"":"s"})`:""}</span>
    <button onclick="testShift(1)">Skip to next day</button>${DAY_OFFSET?'<button onclick="testShift(-DAY_OFFSET)">Back to today</button>':""}<button onclick="browseQuestions()">Browse questions</button><button id="twipe" onclick="testWipe(this)">Wipe test data</button>`;
}
function testShift(n){ DAY_OFFSET=Math.max(0,DAY_OFFSET+n); try{ localStorage.setItem("seodaily-test-offset",String(DAY_OFFSET)); }catch(e){} RUN=null; testTools(); home(); }
function testWipe(btn){
  if(btn.dataset.armed!=="1"){ btn.dataset.armed="1"; btn.textContent="Click again to wipe"; setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed=""; btn.textContent="Wipe test data"; } },4000); return; }
  try{ localStorage.removeItem(KEY); localStorage.removeItem("seodaily-test-offset"); }catch(e){}
  location.reload();
}

/* ---------- Question browser (test copy only) ---------- */
let QB={level:"", diff:"", cat:"", q:"", sample:null};
function browseQuestions(){
  if(!TEST) return;
  VIEW="browse"; RUN=null; document.onkeydown=null; app.className=""; document.getElementById("hdr").className="";
  const ids=BANK.map((_,i)=>i).filter(QUIZABLE);
  const cats=Object.keys(CATS);
  const cnt=(c,d)=>ids.filter(i=>BANK[i][0]===c&&BANK[i][1]===d).length;
  const tot=d=>ids.filter(i=>BANK[i][1]===d).length;
  const lvlRows=Object.entries(LEVELS).map(([k,v])=>`<tr><td><b>${v.label}</b></td><td>${mixText(v)}</td><td>${ids.filter(i=>inLevel(i,v)).length}</td><td><button class="btn ghost" style="padding:5px 10px;font-size:12.5px" onclick="qbSample('${k}')">Sample a daily set</button></td></tr>`).join("");
  app.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><h1 style="margin:0">Question bank</h1><button class="btn ghost" onclick="QB.sample=null;home()">Back to dashboard</button></div>
  <div class="qb-grid">
    <div class="card"><div class="label">Levels (separate pools, no overlap)</div>
      <table class="qb"><tr><th>Level</th><th>Daily set</th><th>Pool</th><th></th></tr>${lvlRows}</table></div>
    <div class="card"><div class="label">Questions by topic and difficulty (${ids.length} total)</div>
      <table class="qb"><tr><th>Topic</th><th>Easy</th><th>Medium</th><th>Hard</th></tr>
      ${cats.map(c=>`<tr><td>${CATS[c]}</td>${[1,2,3].map(d=>`<td${cnt(c,d)===0?' class="zero"':""}>${cnt(c,d)}</td>`).join("")}</tr>`).join("")}
      <tr class="tot"><td>Total</td><td>${tot(1)}</td><td>${tot(2)}</td><td>${tot(3)}</td></tr></table></div>
  </div>
  <div class="card section">
    <div class="row" style="gap:8px">
      <select id="qbd"><option value="">All difficulties</option><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option></select>
      <select id="qbc"><option value="">All topics</option>${cats.map(c=>`<option value="${c}">${CATS[c]}</option>`).join("")}</select>
      <input id="qbs" placeholder="Search questions…" style="flex:1;min-width:180px;font:14px var(--sans);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
    </div>
    <p class="note" id="qbn" style="margin:12px 0 0"></p>
    <div id="qbl" class="qbl"></div>
  </div>`;
  $("#qbd").value=QB.diff; $("#qbc").value=QB.cat; $("#qbs").value=QB.q;
  $("#qbd").onchange=e=>{QB.diff=e.target.value;QB.sample=null;qbList();};
  $("#qbc").onchange=e=>{QB.cat=e.target.value;QB.sample=null;qbList();};
  $("#qbs").oninput=e=>{QB.q=e.target.value;QB.sample=null;qbList();};
  qbList();
}
function qbSample(level){
  const keep=S.level; S.level=level; const ids=buildDaily(dateKey()); S.level=keep;
  QB.sample={level, ids}; QB.diff=""; QB.cat=""; QB.q="";
  ["#qbd","#qbc","#qbs"].forEach(x=>$(x).value="");
  qbList(); $("#qbn").scrollIntoView({behavior:"smooth",block:"start"});
}
function qbList(){
  let ids;
  if(QB.sample) ids=QB.sample.ids;
  else {
    const q=QB.q.trim().toLowerCase();
    ids=BANK.map((_,i)=>i).filter(i=>QUIZABLE(i)&&(!QB.diff||BANK[i][1]==+QB.diff)&&(!QB.cat||BANK[i][0]===QB.cat)&&(!q||(BANK[i][2]+" "+BANK[i][3]).toLowerCase().includes(q)))
      .sort((a,b)=>BANK[a][1]-BANK[b][1]||BANK[a][0].localeCompare(BANK[b][0]));
  }
  $("#qbn").innerHTML = QB.sample
    ? `Sample daily set for <b>${LEVELS[QB.sample.level].label}</b> on ${dateKey()} (what a new player at that level would get). <a href="#" onclick="event.preventDefault();QB.sample=null;qbList()">Show all questions</a>`
    : `Showing ${ids.length} question${ids.length===1?"":"s"}.`;
  $("#qbl").innerHTML=ids.map((i,n)=>{ const q=BANK[i]; return `<details class="qbi"><summary><span class="tag d${q[1]}">${DIFF[q[1]]}</span><span class="tag">${CATS[q[0]]}</span><span class="qq">${QB.sample?`${n+1}. `:""}${fmt(q[2])}</span></summary>
    <div class="qa"><div class="ok">✓ ${fmt(q[3])}</div>${q[4].map(w=>`<div class="no">✗ ${fmt(w)}</div>`).join("")}<p class="note" style="margin:8px 0 0">${fmt(q[5])}</p></div></details>`; }).join("") || '<p class="note">No questions match.</p>';
}

/* ---------- Theme switcher (saved per browser) ---------- */
const ACCENTS={indigo:"#4F46E5",blue:"#2563EB",teal:"#0D9488",green:"#16A34A",orange:"#EA580C",pink:"#DB2777",violet:"#7C3AED"};
const THEME_KEY="seodaily-theme";
function getTheme(){ try{ return Object.assign({mode:"light",accent:"indigo"},JSON.parse(localStorage.getItem(THEME_KEY)||"{}")); }catch(e){ return {mode:"light",accent:"indigo"}; } }
function applyTheme(t){
  const m=t.mode==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t.mode;
  document.documentElement.dataset.mode=m;
  document.documentElement.style.setProperty("--accent",ACCENTS[t.accent]||ACCENTS.indigo);
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===t.mode));
  document.querySelectorAll("#swatches button").forEach(b=>b.classList.toggle("on",b.dataset.a===t.accent));
}
function setTheme(patch){ const t=Object.assign(getTheme(),patch); try{ localStorage.setItem(THEME_KEY,JSON.stringify(t)); }catch(e){} applyTheme(t); }
(function initTheme(){
  const sw=document.getElementById("swatches");
  sw.innerHTML=Object.entries(ACCENTS).map(([k,c])=>`<button data-a="${k}" style="background:${c}" aria-label="${k} accent" title="${k[0].toUpperCase()+k.slice(1)}"></button>`).join("");
  sw.onclick=e=>{ const b=e.target.closest("button"); if(b) setTheme({accent:b.dataset.a}); };
  document.getElementById("modeSeg").onclick=e=>{ const b=e.target.closest("button"); if(b) setTheme({mode:b.dataset.m}); };
  const btn=document.getElementById("themeBtn"), pop=document.getElementById("themePop");
  btn.onclick=e=>{ e.stopPropagation(); const open=pop.classList.toggle("hidden")===false; btn.setAttribute("aria-expanded",open); };
  document.addEventListener("click",e=>{ if(!pop.classList.contains("hidden")&&!pop.contains(e.target)&&e.target!==btn){ pop.classList.add("hidden"); btn.setAttribute("aria-expanded","false"); } });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!pop.classList.contains("hidden")){ pop.classList.add("hidden"); btn.setAttribute("aria-expanded","false"); } });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(getTheme().mode==="auto") applyTheme(getTheme()); });
  applyTheme(getTheme());
})();
/* ---------- Name ---------- */
function nameScreen(){
  VIEW="name"; app.className="narrow"; document.getElementById("hdr").className="narrow";
  const returning=!!S.name;
  app.innerHTML=`<div class="card"><div class="label">${returning?"Your profile":"Welcome to SEO Daily"}</div><h1>${returning?"Name and level":"What's your name?"}</h1>
    <p class="note">Your name is how you'll appear on the team leaderboard. Your progress saves in this browser, like Wordle.</p>
    <form id="nf" style="margin-top:14px">
      <input id="nm" maxlength="30" autocomplete="name" placeholder="e.g. Jayden" style="width:100%;font:16px var(--sans);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
      <div class="label" style="margin:20px 0 10px">Your level</div>
      <div class="lvls">${Object.entries(LEVELS).map(([k,v])=>`<label class="lvl"><input type="radio" name="lvl" value="${k}"${S.level===k?" checked":""}><span><b>${v.label}</b><small>${v.blurb}</small><em>${mixText(v)} questions · ${BANK.filter((_,i)=>inLevel(i,v)).length} in its pool</em></span></label>`).join("")}</div>
      <p class="note" id="nerr" style="color:var(--bad);min-height:1.2em;margin:10px 0 0"></p>
      <div class="row" style="margin-top:8px">${returning&&LEVELS[S.level]?'<button class="btn ghost" type="button" id="ncancel">Cancel</button>':""}<button class="btn" type="submit">${returning?"Save":"Start →"}</button></div>
    </form></div>`;
  $("#nm").value=S.name||""; if(!returning) $("#nm").focus();
  if($("#ncancel")) $("#ncancel").onclick=()=>{ if(LEVELS[S.level]) home(); };
  $("#nf").onsubmit=e=>{
    e.preventDefault();
    const v=$("#nm").value.replace(/\s+/g," ").trim().slice(0,30);
    const pickedEl=document.querySelector('input[name="lvl"]:checked'), picked=pickedEl&&pickedEl.value;
    if(!v){ $("#nerr").textContent="Please enter your name."; return; }
    if(!LEVELS[picked]){ $("#nerr").textContent="Please choose your level."; return; }
    const changed=S.level!==picked;
    S.name=v; S.level=picked; if(!S.pid) S.pid=newId();
    // a new level gets a fresh daily set, unless today's quiz is already under way
    if(changed && S.daily && !S.daily.answers.length && !S.daily.done) S.daily=null;
    save(); lastPushed=""; pushScore(); home();
  };
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.daily && S.daily.date!==dateKey() && (!RUN||RUN.mode!=="practice")) home(); });
testTools();
home();
initBoard();
</script>
