<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Daily — Technical SEO Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB; --paper:#F4F6FB; --card:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#E3E7F0;
  --accent:#4F46E5; --accent-dark:color-mix(in srgb,var(--accent) 78%,#000); --accent-ink:color-mix(in srgb,var(--accent) 72%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--card)); --accent-tint:color-mix(in srgb,var(--accent) 35%,var(--card));
  --chip:#F3F4F6; --chip-ink:#374151; --orange-soft:#FFEDD5; --orange-ink:#9A3412; color-scheme:light;
  --good:#16A34A; --good-soft:#DCFCE7; --good-ink:#166534;
  --bad:#DC2626; --bad-soft:#FEE2E2; --bad-ink:#991B1B;
  --gold:#D97706; --gold-soft:#FEF3C7; --gold-ink:#92400E;
  --sans:'Montserrat',system-ui,sans-serif; --mono:var(--sans); --serif:var(--sans);
}

html[data-mode="dark"]{
  --bg:#0E111C; --paper:#0E111C; --card:#171B2B; --ink:#F3F4F6; --muted:#9CA3AF; --line:#272D45;
  --accent-ink:color-mix(in srgb,var(--accent) 55%,#fff); --accent-soft:color-mix(in srgb,var(--accent) 22%,var(--card)); --accent-tint:color-mix(in srgb,var(--accent) 55%,var(--card));
  --good:#22C55E; --good-soft:#0F2A1B; --good-ink:#86EFAC;
  --bad:#EF4444; --bad-soft:#331417; --bad-ink:#FCA5A5;
  --gold:#F59E0B; --gold-soft:#33260C; --gold-ink:#FCD34D;
  --chip:#232842; --chip-ink:#D1D5DB; --orange-soft:#35200F; --orange-ink:#FDBA74; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.narrow{max-width:760px;margin:0 auto}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.news-col{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:1000px){.home-grid{grid-template-columns:1fr}.news-col{position:static;max-height:none}}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-weight:800;font-size:26px;letter-spacing:-.03em}
.brand span{color:var(--accent)}
.meta{font-size:13px;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card.hero{background:var(--accent);border-color:var(--accent);color:#fff}
.hero .label,.hero .note{color:#ffffffd0}
.hero h1,.hero .big{color:#fff}.hero .big span{color:#ffffffa8!important}
.hero .btn{background:#fff;color:color-mix(in srgb,var(--accent) 78%,#000)}
.hero .btn:hover{background:#ffffffe6}
.hero .btn.ghost{background:transparent;color:#fff;border:1.5px solid #ffffff80}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{border-radius:10px;padding:12px 14px;border:0}
.stat:nth-child(1){background:var(--gold-soft);color:var(--gold-ink)}
.stat:nth-child(2){background:var(--orange-soft);color:var(--orange-ink)}
.stat:nth-child(3){background:var(--accent-soft);color:var(--accent-ink)}
.stat:nth-child(4){background:var(--good-soft);color:var(--good-ink)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.stat small{font-size:12px;font-weight:600;opacity:.9}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
h1,h2{font-weight:800;letter-spacing:-.025em;margin:0 0 8px;line-height:1.2}
h1{font-size:28px}h2{font-size:20px}
p{margin:0 0 12px}
.btn{font:700 14px var(--sans);border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .08s,background .15s}
.btn:hover{background:var(--accent-dark)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{font:600 14px var(--sans);padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.section{margin-top:20px}
.label{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:190px 1fr 56px;gap:10px;align-items:center;font-size:13.5px;font-weight:500}
.bar .track{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .pct{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right}
@media (max-width:560px){.bar{grid-template-columns:130px 1fr 46px;font-size:12.5px}}
.week{display:flex;gap:6px}
.day{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.day i{display:block;height:34px;border-radius:8px;background:var(--accent-soft);margin-bottom:4px;font-style:normal;line-height:34px;color:var(--accent-ink);font-size:12.5px;font-weight:700}
.day i.on{background:var(--accent);color:#fff}
.day i.today{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
.tag.d1{background:var(--good-soft);color:var(--good-ink)}.tag.d2{background:var(--gold-soft);color:var(--gold-ink)}.tag.d3{background:var(--bad-soft);color:var(--bad-ink)}
.tag.rev{background:var(--accent-soft);color:var(--accent-ink)}
.q{font-size:19px;font-weight:700;margin-bottom:18px;line-height:1.45;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:500 15px/1.45 var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent-tint);background:var(--accent-soft)}
.opt .k{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none;margin-top:1px}
.opt.sel{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border:2px solid var(--good);background:var(--good-soft);color:var(--good-ink)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.confirm{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.confirm span{margin-right:auto;font-size:14.5px;font-weight:600;color:var(--accent-ink)}
.explain{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--good-soft);color:var(--good-ink);font-size:14.5px}
.explain.bad{background:var(--bad-soft);color:var(--bad-ink)}
.explain strong{display:block;margin-bottom:4px;font-weight:800}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;background:var(--chip);border-radius:5px;padding:1px 5px}
.explain code{background:color-mix(in srgb,var(--card) 65%,transparent)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.04em}
.review{display:grid;gap:8px;margin-top:10px}
.rv{display:flex;gap:10px;font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rv .m{font-weight:800;flex:none}
.rv .m.ok{color:var(--good)}.rv .m.no{color:var(--bad)}
.rank{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
.rank b{color:var(--ink);font-weight:800}
.note{font-size:13px;color:var(--muted)}
.news{display:grid;gap:2px}
.ni{display:block;text-decoration:none;color:var(--ink);padding:11px 12px;margin:0 -12px;border-radius:8px}
.ni:hover{background:var(--accent-soft)}
.ni .nd{display:block;font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.ni b{display:block;font-weight:700;font-size:14.5px;line-height:1.35}
.ni span:last-child{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.board-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.board-tabs button{font:600 13px var(--sans);padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.board-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lb{display:grid;gap:4px}
.lb-row{display:grid;grid-template-columns:28px 30px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.lb-row.me{background:var(--accent-soft)}
.lb-row .pos{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.lb-row .pos.top{font-size:15px}
.lb-row .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.lb-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .nm small{font-weight:600;color:var(--accent);font-size:12px;margin-left:6px}
.lb-row .val{font-size:14px;font-weight:800}
.lvls{display:grid;gap:10px}
.lvl{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.lvl:has(input:checked){border:2px solid var(--accent);background:var(--accent-soft)}
.lvl input{margin-top:4px;accent-color:var(--accent)}
.lvl span{display:grid;gap:2px}
.lvl b{font-weight:800}
.lvl small{color:var(--muted);font-size:13.5px}
.lvl em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
#testbar:not(:empty){display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px;padding:10px 14px;border-radius:10px;background:#FEF3C7;color:#92400E;font-size:13px;font-weight:500;border:1.5px solid #FCD34D}
#testbar b{font-weight:800}
#testbar button{font:700 12.5px var(--sans);padding:6px 12px;border-radius:999px;border:1.5px solid #F59E0B;background:#fff;color:#92400E;cursor:pointer}
#testbar button:hover{background:#FFFBEB}
#testbar span{margin-right:auto}
.qb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:900px){.qb-grid{grid-template-columns:1fr}}
table.qb{width:100%;border-collapse:collapse;font-size:13.5px}
table.qb th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:8px;border-bottom:1.5px solid var(--line)}
table.qb td{padding:8px;border-bottom:1px solid var(--line);font-weight:500}
table.qb td:not(:first-child),table.qb th:not(:first-child){text-align:center}
table.qb td.zero{color:var(--bad);font-weight:700}
table.qb tr.tot td{font-weight:800;border-bottom:0}
#qbn a{color:var(--accent);font-weight:600}
.qbl{display:grid;gap:8px;margin-top:12px}
.qbi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
.qbi summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none}
.qbi summary .tag{flex:none}
.qbi .qq{font-size:14.5px;font-weight:600}
.qbi .qa{margin-top:10px;display:grid;gap:4px;font-size:14px}
.qbi .ok{color:var(--good);font-weight:700} .qbi .no{color:var(--muted)}
input:focus,select:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-tint)}
.hidden{display:none}

.hdr-right{display:flex;align-items:center;gap:14px;position:relative}
.theme-btn{display:inline-flex;align-items:center;gap:7px;font:700 13px var(--sans);padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn .sw{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.theme-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:260px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(15,23,42,.16)}
.theme-pop .label{margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:999px;padding:3px;margin-bottom:16px}
.seg button{font:700 12.5px var(--sans);border:0;background:transparent;color:var(--muted);padding:7px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;outline-offset:3px}
.swatches button.on{outline:2.5px solid var(--ink)}
</style>
<script>
(function(){var A={indigo:"#4F46E5",blue:"#2563EB",teal:"#0D9488",green:"#16A34A",orange:"#EA580C",pink:"#DB2777",violet:"#7C3AED"};
try{var t=JSON.parse(localStorage.getItem("seodaily-theme")||"{}");}catch(e){var t={};}
var m=t.mode||"light"; if(m==="auto") m=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.mode=m; if(A[t.accent]) document.documentElement.style.setProperty("--accent",A[t.accent]);})();
</script>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <div class="brand">SEO<span>Daily</span></div>
    <div class="hdr-right"><div class="meta" id="today"></div>
      <button class="theme-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false"><span class="sw"></span>Theme</button>
      <div class="theme-pop hidden" id="themePop" role="dialog" aria-label="Theme">
        <div class="label">Mode</div>
        <div class="seg" id="modeSeg"><button data-m="light">Light</button><button data-m="dark">Dark</button><button data-m="auto">Auto</button></div>
        <div class="label">Accent colour</div>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>
  </header>
  <div id="testbar"></div>
  <main id="app"></main>
</div>

<script>
/* ---------- Question bank ----------
   Format: [category, difficulty(1-3), question, correct answer, [wrong answers], explanation]
   IDs are array positions — only ever append new questions to keep progress stable. */
const CATS = {
  crawl:"Crawling & robots.txt", index:"Indexing & canonicals", status:"Status codes & redirects",
  js:"Rendering & JavaScript", cwv:"Core Web Vitals", schema:"Structured data",
  intl:"International & hreflang", sitemap:"XML sitemaps", arch:"Architecture & internal links",
  logs:"Logs & crawl budget", mobile:"Mobile, HTTPS & URLs", gsc:"Search Console", ai:"AI search & bots",
  onpage:"On-page & content", local:"Local & ecommerce"
};
const BANK = [
["crawl",1,"Where must a robots.txt file live for its rules to apply to `https://shop.example.com`?","At `https://shop.example.com/robots.txt` — the root of that exact host and protocol",["Anywhere on the domain, as long as it's linked from the homepage","At `https://example.com/robots.txt` — the root domain covers all subdomains","Inside the XML sitemap"],"robots.txt only applies to the protocol, host and port it's served from. Every subdomain needs its own file at its root."],
["crawl", 1, "A URL is disallowed in robots.txt. Can it still show up in Google's index?", "Yes, if other pages link to it, the URL can be indexed without its content", ["No, a Disallow rule removes the URL from Google's index within a few days", "Only if the page also carries a noindex meta tag", "No, blocked URLs are skipped completely by every Google system"], "Disallow controls crawling, not indexing. A blocked URL with external links can be indexed with no snippet ('No information is available for this page')."],
["crawl", 2, "You want a page out of Google's index for good. What's the reliable method?", "Allow crawling and serve `noindex` (meta tag or `X-Robots-Tag`)", ["Add a `Disallow:` rule for the URL in robots.txt", "Add a `Noindex:` line for the URL in robots.txt", "Add `rel=\"nofollow\"` to every internal link that points at the page"], "Google has to crawl the page to see noindex. Blocking it in robots.txt hides the noindex. Google stopped supporting `Noindex:` in robots.txt in 2019."],
["crawl",1,"How does Googlebot treat a `Crawl-delay` line in robots.txt?","It ignores it",["It waits that many seconds between requests","It waits that many milliseconds between requests","It applies it to images only"],"Google doesn't support crawl-delay. Googlebot adjusts its crawl rate automatically based on how your server responds. Some other crawlers, such as Bingbot, do respect it."],
["crawl", 2, "robots.txt has `Disallow: /shop/` and `Allow: /shop/sale/`. Can Googlebot crawl `/shop/sale/shoes`?", "Yes, the longest (most specific) matching rule wins", ["No, a Disallow rule always overrides any Allow rule", "No, Google applies whichever rule appears first in the file", "Only if the URL is also listed in the XML sitemap"], "Google uses the longest matching path. If two matching rules are the same length, the less restrictive one (Allow) wins."],
["crawl",2,"What happens when a site's robots.txt returns a 404?","Google assumes there are no crawl restrictions",["Google stops crawling the whole site","Google treats every URL as disallowed","Google drops the site from the index"],"Most 4xx responses for robots.txt are treated as 'no robots.txt'. 5xx responses are a different story."],
["crawl", 2, "After a site release, Search Console shows crawling suddenly dropping and a robots.txt fetch problem. What should you check first?", "Whether `/robots.txt` loads, because server errors there pause crawling", ["Whether the XML sitemap picked up the new URLs", "Whether the homepage title tag or meta description changed in the release", "Whether the Google Analytics tag is still firing"], "If Google can't fetch robots.txt because of a server error, it plays safe and stops crawling. Open `yoursite.com/robots.txt` after every big release, and check the robots.txt report under Settings in Search Console."],
["crawl",2,"You want to stop Google crawling internal site-search pages like `/search?q=shoes`. What's the simplest robots.txt rule?","`Disallow: /search`",["`Noindex: /search`","`Disallow: shoes`","`Block: /search?q=`"],"Disallow rules match the start of the URL path, so `/search` covers every internal search URL. Just check it doesn't also catch real pages, like `/search-tips`."],
["crawl",1,"What's the quickest way to check whether Google is allowed to crawl and index a specific page?","Search Console's URL Inspection tool",["Search for the page's title in Google","Run the page through PageSpeed Insights","Read the page's meta description"],"URL Inspection shows whether crawling and indexing are allowed, the last crawl date and the canonical Google chose. It's the best first check when a page isn't showing up."],
["crawl",2,"Are robots.txt path rules case-sensitive?","Yes — `Disallow: /Admin/` doesn't block `/admin/`",["No, paths are matched case-insensitively","Only the user-agent line is case-sensitive","Only on Windows servers"],"Paths in Allow and Disallow rules are case-sensitive. User-agent names are not."],
["ai", 2, "What does the `Google-Extended` user-agent token in robots.txt control?", "Use of your content for training and grounding Gemini, not Search", ["Whether your pages can appear in Google Search and in AI Overviews at all", "Whether Googlebot renders JavaScript on your pages", "How often Googlebot-Image crawls your image files"], "Google-Extended is a control token, not a separate crawler. Blocking it doesn't remove you from Search, and AI Overviews are governed by Search's own controls."],
["index",1,"What is `rel=\"canonical\"` to Google?","A strong hint, which Google can override",["A directive Google always obeys","A redirect","A ranking factor that boosts the canonical page"],"Google weighs canonical tags alongside redirects, internal links, sitemaps and content similarity. Conflicting signals can lead it to choose a different canonical."],
["index",2,"Page A has `rel=canonical` pointing to page B, and page B is `noindex`. What's the problem?","Mixed signals: the canonical target should be an indexable 200 page",["Nothing — this is the recommended way to hide duplicates","Page A gets a manual action","Google indexes both pages"],"A canonical says 'index B instead', while noindex on B says 'don't index B'. Point canonicals at indexable, 200-status URLs."],
["index", 1, "Why do most SEOs add a self-referencing canonical to every indexable page?", "It points tracking, parameter and case variants to the clean URL", ["Google won't index a page unless it has one", "It doubles the internal PageRank the page receives", "It stops scraper sites from copying the page's content and outranking you"], "URLs like `?utm_source=` or `?ref=` create duplicates. A self-canonical tells Google which version you prefer."],
["index",2,"How can you set a canonical for a PDF file?","With an HTTP `Link: <url>; rel=\"canonical\"` response header",["With a `<link rel=canonical>` tag inside the PDF","You can't — PDFs can't be canonicalized","Through robots.txt"],"Non-HTML files can't carry HTML tags, so you send the canonical, and directives such as `X-Robots-Tag: noindex`, as HTTP headers."],
["index",1,"Which header lets you noindex a PDF or an image file?","`X-Robots-Tag: noindex`",["`Cache-Control: noindex`","`Link: noindex`","`Content-Type: noindex`"],"X-Robots-Tag supports the same directives as the robots meta tag, sent in the HTTP response."],
["gsc", 2, "What does 'Crawled – currently not indexed' in Search Console usually mean?", "Google fetched the page but chose not to index it", ["robots.txt stopped Google from fetching the page", "The server returned 5xx errors when Google tried", "A manual action has removed the page from results"], "It's Google's choice, not a technical block. Improve uniqueness and value, internal links and consolidation."],
["gsc", 2, "What does 'Discovered – currently not indexed' mean?", "Google knows the URL but hasn't crawled it yet", ["Google crawled the page and rejected its content", "The page carries a noindex tag Google respected", "The URL redirects, so Google dropped it"], "Google found the URL in links or sitemaps but put off crawling it. On large sites this often points to crawl budget or server capacity limits."],
["gsc", 2, "'Duplicate, Google chose different canonical than user' means:", "Google ignored your declared canonical and picked another URL", ["Your canonical tag is malformed, so Google couldn't read it at all", "The page contains two canonical tags that conflict", "The page's hreflang annotations contain an error"], "Your signals conflict, for example internal links or the sitemap pointing at the other version. Align your signals so they back up your canonical."],
["index", 1, "How does Google treat `example.com/page#pricing` compared with `example.com/page`?", "As the same URL, because fragments are ignored for indexing", ["As two separate pages, indexed one by one", "As a duplicate content violation that gets flagged in Search Console", "As a client-side redirect to the main URL"], "Fragments after `#` aren't sent to the server and are ignored for indexing. Don't rely on them for distinct pages."],
["index", 3, "Search Console's URL Parameters tool is gone. How should you manage parameter duplication now?", "Canonicals, clean internal links and robots.txt for wasteful parameters", ["Email Google support a list of parameters to ignore", "Submit the parameter URLs to the Removals tool each month to hide them", "Add `nofollow` to every link that contains a parameter"], "Google retired the tool in 2022, saying its systems can figure out parameters. You control it on your own site."],
["index", 2, "What does the `data-nosnippet` HTML attribute do?", "Keeps a specific section of text out of search snippets", ["Removes the whole page from Google's index", "Hides the element from visitors but not from Google", "Stops Google following any links inside the element"], "You can put it on span, div and section elements to exclude that text from snippets. The page stays indexed."],
["index", 2, "How long does a Search Console Removals request hide a URL?", "About six months, so it needs a permanent fix as well", ["Permanently, until you cancel the request yourself", "About 24 hours, until Google next recrawls the URL", "Until the next core update, when it's re-evaluated"], "Removals is an emergency hide. Without a permanent signal, the URL can come back once the request expires."],
["index", 1, "Last year's Black Friday page still ranks, but the offer has ended. What's usually the best move?", "Keep the URL and update it for the next sale", ["Leave it live with last year's prices and dates", "Delete it and redirect it to the homepage", "Add `nofollow` and wait for it to drop out"], "Reusing one evergreen URL for a recurring promo, like `/black-friday`, keeps its links and history. Redirecting to the homepage is often treated as a soft 404."],
["status", 1, "Does a 302 redirect pass PageRank?", "Yes, both pass signals; they differ in which URL stays canonical", ["No, only a 301 passes PageRank; a 302 keeps all signals on the old URL", "Only for the first 30 days, then it stops", "Only when the target is on the same domain"], "A 301 strongly signals that the target should become canonical. A 302 signals a temporary move, so Google tends to keep the source URL. Use the code that matches your intent."],
["status", 2, "404 vs 410 — what's the practical difference for Google?", "Both lead to removal; 410 can be processed slightly faster", ["410 signals a problem, so the site gets penalized", "404 keeps the page indexed until you request removal in Search Console", "410 automatically sends users to the homepage"], "Both are fine for removed content. Use 410 when you're sure it's gone for good, but don't lose sleep over which you pick."],
["status", 1, "What's a 'soft 404'?", "A 200 OK page that looks like an error or empty page", ["A 404 page with a friendly custom design and a search box on it", "A 404 URL that's still linked internally", "A 301 redirect that ends on a 404 page"], "Examples are 'no results found' pages or thin, empty templates served with a 200. Return a real 404/410, or add content."],
["status", 2, "Your site is down for 2 hours of planned maintenance. Which status code should it return?", "503 Service Unavailable, ideally with `Retry-After`", ["404 Not Found until the site is back up", "200 OK with a short maintenance message", "301 redirect to a dedicated maintenance page until the work is done"], "A 503 tells crawlers the outage is temporary. A 200 maintenance page risks being indexed as soft 404s. Long-running 503s can still lead to deindexing."],
["status", 1, "A Screaming Frog crawl shows lots of internal links pointing to URLs that 301 redirect. What should you do?", "Update the links to point straight at the final URL", ["Leave them, because internal redirects pass extra value", "Change the 301s to 302s so Google rechecks them", "Add the redirecting URLs to the XML sitemap"], "The redirects still work, but linking directly is faster for users and saves crawl effort. Fix the most-linked ones first, like the navigation and footer."],
["status",3,"How many redirect hops will Googlebot follow before giving up?","Up to 10",["Up to 3","Just 1","Unlimited"],"Google follows up to 10 hops. Every hop adds latency and risk, so collapse chains into a single redirect."],
["status",2,"How does Google treat a 308 redirect?","Like a 301 — permanent",["Like a 302 — temporary","As an error","As a soft 404"],"308 is the permanent redirect that preserves the HTTP method. 307 is its temporary counterpart and is treated like a 302."],
["status", 1, "You're changing a blog URL from `/blog/seo-tips-2025` to `/blog/seo-tips`. What should you set up?", "A 301 from old to new, then update the internal links", ["A 302 redirect, in case the URL changes again", "Nothing, because Google will find the new URL itself", "Delete the old page and let Google drop it naturally"], "A 301 sends visitors and ranking signals to the new URL. Updating internal links and the sitemap helps Google pick up the change faster."],
["status", 2, "Your server starts returning many 429 and 5xx responses to Googlebot. What happens?", "Googlebot automatically slows down its crawling", ["Googlebot speeds up to retry the failed URLs", "Nothing changes, because errors are ignored", "Every affected URL is deindexed straight away"], "Google backs off when your server struggles. If errors persist, URLs can eventually drop out of the index."],
["status", 1, "During an HTTP → HTTPS migration, how should redirects work?", "301 each HTTP URL to its exact HTTPS equivalent", ["301 every HTTP URL to the HTTPS homepage", "302 everything for the first year, then switch", "No redirects; Google picks HTTPS automatically"], "One-to-one redirects keep signals for each page. Redirecting everything to the homepage creates soft 404s."],
["status", 2, "A dev proposes redirecting every 404 to the homepage 'to save link equity'. What usually happens?", "Google treats them as soft 404s and users get confused", ["The homepage gains rankings from the extra links", "Google treats it as a clean, recommended 301 setup", "Google classes it as cloaking and bans the site"], "Redirect only to a closely relevant replacement. Otherwise return 404/410."],
["js", 1, "What browser engine does Googlebot use to render pages?", "An evergreen, regularly updated version of Chromium", ["A frozen copy of Chrome 41 kept for stability", "A custom build of Firefox that Google maintains for its crawlers", "None; Google only reads the raw HTML response"], "Google moved to an evergreen Chromium renderer in 2019, so modern JavaScript features are generally supported."],
["js",1,"Which of these links can Google reliably discover and follow?","`<a href=\"/pricing\">Pricing</a>`",["`<span onclick=\"goTo('/pricing')\">Pricing</span>`","`<a onclick=\"goTo('/pricing')\">Pricing</a>` with no href","`<a href=\"javascript:void(0)\">Pricing</a>`"],"Google follows `<a>` elements that have a resolvable URL in `href`. Click handlers alone aren't crawlable links."],
["js", 2, "Products only load after a user clicks a 'Load more' button. What's the SEO risk?", "Googlebot doesn't click, so those products may be missed", ["None, because Googlebot clicks every visible button", "Google penalizes pages that hide content behind buttons", "Only the button's own text ends up in the index"], "Back infinite scroll and load-more patterns with crawlable paginated URLs, such as `?page=2`, using real `<a href>` links."],
["js",3,"The raw HTML has `<meta name=\"robots\" content=\"noindex\">`, and JavaScript removes it after load. What happens?","Google may skip rendering and honor the noindex",["Google renders first, sees no noindex, and indexes the page","Google indexes the page twice","Google flags it as cloaking"],"If Google sees noindex in the initial HTML, it may not render the page at all. Never rely on JS to remove a noindex."],
["js", 2, "Why is server-side rendering (SSR) generally safer for SEO than pure client-side rendering?", "Content and links are in the initial HTML for every crawler", ["Google gives server-rendered pages a ranking bonus", "Server-rendered pages don't need internal links", "Client-side rendering is banned by Google's guidelines"], "Google can render JS, but rendering can be delayed, and many other crawlers, including most AI crawlers, don't execute JavaScript."],
["js", 3, "What is Google's current stance on dynamic rendering (serving pre-rendered HTML to bots)?", "A workaround, not a long-term solution", ["The recommended best practice for every JS site", "Cloaking that leads to a manual action", "A requirement for React and Vue sites"], "Google's docs call dynamic rendering a workaround. It isn't cloaking if the content is equivalent, but it adds complexity."],
["js",1,"Should you block your JS and CSS files in robots.txt?","No — Google needs them to render the page properly",["Yes, it saves crawl budget with no downside","Yes, but only the CSS","Only on mobile"],"Blocking rendering resources can make Google see a broken or empty page."],
["js", 2, "An SPA uses hash routing such as `/#/products/shoes`. What's the SEO problem?", "Google ignores fragments, so every route collapses into one URL", ["None, because hash URLs are the pattern Google recommends for single-page apps", "Hash URLs double the crawl budget each route needs", "Google treats each hash route as a separate subdomain"], "Each view needs its own real, crawlable URL."],
["gsc", 1, "How can you see the HTML Google rendered for a page?", "URL Inspection → Test live URL → View tested page", ["View source in your browser while logged out of your Google account", "The pages report inside Google Analytics", "Search Console's robots.txt report"], "The tested page shows the rendered HTML, a screenshot and any resource-loading errors, so you see what Google sees."],
["cwv", 2, "Should you lazy-load the main hero image, which is the LCP element?", "No, it delays LCP; load it eagerly with high priority", ["Yes, lazy-load every image to save bandwidth", "Yes, but only on mobile, where data costs more and lazy-loading saves most", "It makes no difference to how LCP is measured"], "Lazy-load below-the-fold images. The LCP image should be discoverable early in the HTML and prioritized."],
["cwv",1,"What are the three Core Web Vitals?","LCP, INP, CLS",["LCP, FID, CLS","TTFB, FCP, CLS","LCP, INP, TTFB"],"INP (Interaction to Next Paint) replaced FID as a Core Web Vital in March 2024."],
["cwv",1,"What's the 'good' threshold for Largest Contentful Paint (LCP)?","2.5 seconds or less",["1 second or less","4 seconds or less","200 ms or less"],"Good is ≤2.5 s, needs improvement is up to 4 s, and poor is anything above 4 s."],
["cwv",1,"What's the 'good' threshold for Interaction to Next Paint (INP)?","200 ms or less",["100 ms or less","500 ms or less","2.5 seconds or less"],"Good is ≤200 ms, needs improvement is up to 500 ms, and poor is anything above 500 ms."],
["cwv",1,"What's the 'good' threshold for Cumulative Layout Shift (CLS)?","0.1 or less",["0.25 or less","1.0 or less","100 ms or less"],"CLS is a unitless score. Good is ≤0.1 and poor is anything above 0.25."],
["cwv", 3, "At what percentile is a page assessed for passing Core Web Vitals?", "The 75th percentile of real-user page loads", ["The median (50th percentile) of page loads", "The 95th percentile of the slowest page loads", "The average score across several lab tests"], "If 75% of visits meet the 'good' threshold, the metric passes. This is field data from CrUX."],
["cwv", 2, "What's the difference between CrUX and Lighthouse data?", "CrUX is real-user field data; Lighthouse is a lab test", ["They're two names for the same Google dataset", "CrUX is lab data; Lighthouse is real-user data", "Lighthouse scores are what Google uses for ranking"], "Google's page experience assessment uses field data. Lab tools are for debugging."],
["cwv", 1, "Which of these commonly causes high CLS?", "Images and ads with no reserved width and height", ["A slow server response before the HTML arrives", "Too many internal links in the main navigation", "Serving the page over HTTPS instead of HTTP"], "Reserve space for images, embeds, ads and banners. Late-loading web fonts can also shift text."],
["cwv", 2, "What does INP measure?", "Responsiveness to clicks, taps and key presses across the visit", ["The delay before the very first interaction only, like the old FID metric", "The time until the first byte of HTML arrives", "How long the page takes to load completely"], "Unlike FID, which only measured the first input's delay, INP covers interactions across the whole page lifecycle."],
["cwv", 1, "Where can you see whether real visitors get good Core Web Vitals across your whole site?", "Search Console's Core Web Vitals report", ["Search Console's Links report", "The Google Ads keyword planner", "Search Console's Crawl Stats report, under Settings"], "It groups URLs as Good, Needs improvement or Poor using real Chrome user data. Use PageSpeed Insights to dig into a single page."],
["cwv", 2, "What's a 'long task' in performance terms?", "Main-thread work longer than 50 ms", ["Any single network request over 1 MB", "A page containing over 3,000 words", "A redirect chain longer than three hops"], "Breaking up long tasks, for example by yielding to the main thread, is a key INP fix."],
["cwv", 2, "PageSpeed Insights flags 'Properly size images' and 'Serve images in next-gen formats' on a product page. What's the practical fix?", "Resize and compress images, and serve WebP or AVIF", ["Remove the product images to speed the page up", "Lazy-load the main product image at the top", "Switch from HTTPS to HTTP to save handshake time"], "Oversized images are one of the most common causes of slow loading. Most CMSs and image CDNs can resize and convert images automatically."],
["cwv",1,"A banner appears at the top of the page after a second and pushes everything down. Which metric does this hurt?","CLS (Cumulative Layout Shift)",["LCP (Largest Contentful Paint)","INP (Interaction to Next Paint)","TTFB (Time to First Byte)"],"Content jumping around after it appears is a layout shift. Reserve space for banners, cookie notices and ads, or overlay them instead."],
["schema",1,"Which structured data format does Google recommend?","JSON-LD",["Microdata","RDFa","Open Graph"],"Google supports all three structured data formats but recommends JSON-LD because it's the easiest to implement and maintain. Open Graph isn't schema.org markup."],
["schema", 1, "Does valid structured data guarantee rich results?", "No, it only makes the page eligible", ["Yes, within 24 hours of Google recrawling it", "Yes, once the Rich Results Test shows no errors", "Only for Product markup with a price"], "Eligibility isn't a guarantee. Quality, relevance and policy compliance all matter."],
["schema", 2, "Which sites can still get FAQ rich results in Google?", "Only well-known, authoritative government and health sites", ["Any site with valid FAQPage markup on the page", "Only ecommerce sites with product FAQs", "No sites, because FAQPage is no longer valid schema.org markup"], "Google restricted FAQ rich results in August 2023. The markup is still valid schema.org; it just won't show for most sites."],
["schema", 2, "What's the status of HowTo rich results?", "Deprecated; Google no longer shows them", ["Shown on both desktop and mobile results", "Shown on mobile results only", "Required on recipe and DIY pages"], "Google deprecated HowTo rich results in 2023."],
["schema",1,"Which tool checks whether a page is eligible for Google rich results?","Google's Rich Results Test",["PageSpeed Insights","The robots.txt report","Google Tag Manager"],"The Schema Markup Validator checks general schema.org validity, while the Rich Results Test checks Google-specific eligibility."],
["schema", 2, "You add Review markup to content that isn't visible on the page. What's the risk?", "It breaks Google's guidelines and risks a manual action", ["None, because hidden markup is allowed if it's accurate", "A small ranking boost from the extra review data", "The page becomes eligible for AMP features"], "Markup must describe content that users can see on the page."],
["schema", 3, "Can a business show star ratings from reviews about itself (self-serving) using LocalBusiness or Organization markup?", "No, self-serving review stars aren't eligible", ["Yes, as long as the reviews are genuine", "Yes, once the business has over 50 reviews", "Only when the markup uses microdata"], "Google stopped showing self-serving review snippets for these types in 2019."],
["schema",2,"Which schema.org property links an entity to its official profiles, such as LinkedIn or Wikipedia?","`sameAs`",["`url`","`relatedLink`","`hasPart`"],"`sameAs` helps search engines tie your entity to its other authoritative representations."],
["schema", 1, "Which structured data type can help show price, stock and review stars for an ecommerce page in Google?", "`Product`, with offer and review details", ["`Article`, with the price in the headline", "`BreadcrumbList`, with price in the trail", "`FAQPage`, with stock in the answers"], "Product markup makes product pages eligible for rich results. Keep the price and stock in the markup matching what's visible on the page."],
["schema", 2, "In Article markup, what format should `datePublished` use?", "ISO 8601, ideally with a timezone", ["Day/month/year, such as `14/03/2026`", "Written out, such as `March 14th, 2026`", "A Unix timestamp in seconds"], "ISO 8601 with a timezone avoids any ambiguity about the date."],
["intl",1,"Which hreflang value is invalid?","`en-UK`",["`en-GB`","`es-419`","`fr`"],"The region code for the United Kingdom is `GB` (ISO 3166-1 alpha-2). `es-419` (Latin America) is a valid UN M.49 region."],
["intl", 1, "What is `hreflang=\"x-default\"` for?", "The fallback for users who don't match any listed version", ["The default canonical for the whole cluster", "The English version of the page, which every hreflang set must include", "The mobile version of the page"], "x-default is typically a language selector or global homepage."],
["intl", 2, "Page A (en) lists page B (de) in hreflang, but page B doesn't list page A. What happens?", "Google may ignore it, because hreflang needs return links", ["It works fine, because one direction is enough for Google to pair them", "Google penalizes page B for the missing link", "Google redirects German users from A to B"], "Each page must link to every alternate, and the alternates must link back."],
["intl", 2, "Should each page include a hreflang tag pointing to itself?", "Yes, every page lists itself as well", ["No, a self-reference creates a loop", "Only the x-default page lists itself", "Only the English version lists itself"], "Every page in the cluster lists all versions, including itself."],
["intl",2,"Which of these is NOT a supported way to implement hreflang?","robots.txt",["HTML `<link>` tags in the head","HTTP headers","An XML sitemap"],"Pick one of the three supported methods. Mixing methods raises the risk of conflicts."],
["intl", 3, "Your /fr/ page canonicalizes to the /en/ page while also having hreflang. What's wrong?", "The cross-language canonical tells Google to drop the French page", ["Nothing, because that's the recommended setup", "Nothing, because hreflang always overrides the canonical between languages", "It needs a 301 from /fr/ to /en/ as well"], "Canonicals across languages conflict with hreflang. Translated pages aren't duplicates."],
["intl", 3, "Can you use a region-only hreflang value such as `hreflang=\"us\"`?", "No, a language code is required; region is optional", ["Yes, a region on its own is valid when the language is obvious", "Only for English-speaking countries", "Only when declared in XML sitemaps"], "Use the format `language` or `language-REGION`, e.g. `en-US`. Region alone isn't valid."],
["intl", 2, "Why is auto-redirecting visitors by IP location risky for SEO?", "Googlebot crawls mostly from US IPs and may miss other versions", ["Google's guidelines ban every kind of IP-based redirect, whatever the reason", "Redirects add layout shift and hurt CLS scores", "IP-based redirects break HTTPS certificates"], "Let users choose with a banner or selector, and keep every version crawlable."],
["intl", 2, "Which domain setup sends the strongest geotargeting signal?", "A country-code TLD such as `.de`", ["A subfolder such as `/de/`", "A URL parameter such as `?lang=de`", "A subdomain such as `de.example.com`"], "ccTLDs are inherently tied to a country. Search Console's International Targeting report has been retired."],
["sitemap", 1, "What are the limits for a single XML sitemap file?", "50,000 URLs or 50 MB uncompressed", ["10,000 URLs or 10 MB uncompressed", "1,000 URLs, whatever the file size", "No limits, as long as it's gzipped"], "Split larger sets across multiple sitemaps tied together by a sitemap index."],
["sitemap", 2, "Which sitemap fields does Google use?", "Only `<lastmod>`, if it's consistently accurate", ["`<lastmod>`, `<priority>` and `<changefreq>` equally", "Only `<priority>`, to decide what to crawl first", "None of them; Google reads only `<loc>`"], "Only update lastmod when content meaningfully changes. Faking it destroys its value as a signal."],
["sitemap",1,"Which URLs belong in an XML sitemap?","Canonical, indexable URLs that return 200",["Every URL including redirects and 404s","Only the homepage","noindexed pages, so Google can find the noindex"],"A sitemap is a list of pages you want indexed. Including junk weakens its value as a signal."],
["sitemap", 2, "How do you reference a sitemap in robots.txt?", "`Sitemap:` with a full absolute URL, anywhere in the file", ["`Sitemap: /sitemap.xml` with a relative path, inside the `User-agent: *` group", "`Allow: /sitemap.xml` under `User-agent: *`", "It can't be; sitemaps go only in Search Console"], "The Sitemap line is independent of user-agent groups and must be an absolute URL."],
["sitemap", 1, "You've just launched a new section of the site. What's the simplest way to help Google find the new pages?", "List them in the sitemap and link to them from existing pages", ["Wait, because Google finds new sections on its own within a day or two", "Email Google support with the new URLs", "Add an `index` meta tag to every new page"], "Sitemaps help discovery, but links from pages Google already crawls are often what gets new pages found quickly."],
["sitemap", 2, "Which search engines support IndexNow?", "Bing, Yandex and others, but not Google", ["Google only, through Search Console", "Every major engine, Google included", "None; the protocol has been deprecated"], "IndexNow lets you push URL changes instantly to participating engines. Google hasn't adopted it."],
["sitemap", 2, "Search Console's Sitemaps report says 'Couldn't fetch' for your sitemap. What should you check first?", "That the sitemap URL loads and returns valid XML", ["That every listed page has a meta description", "That the sitemap lists your social media profiles", "That the sitemap file is smaller than 1 KB"], "Typos in the submitted URL, a robots.txt block or a server error are the usual causes. Fix it, then resubmit in Search Console."],
["arch", 1, "What's an orphan page?", "A page with no internal links pointing to it", ["A page with no links pointing out of it to other pages on the site", "A page that has no canonical tag", "A page that returns a 404 status"], "Orphans are hard for crawlers and users to find. A sitemap can surface them, but internal links matter more."],
["arch", 2, "Does adding `nofollow` to internal links 'sculpt' PageRank toward important pages?", "No, PageRank on those links is lost, not redistributed", ["Yes, it's the recommended way to focus link value on your key pages", "Yes, but only for links from the homepage", "Only for footer and sidebar links"], "Google changed how nofollow PageRank flows years ago. Fix architecture instead: link more to what matters."],
["arch", 2, "What's the biggest technical SEO risk of faceted navigation (filters)?", "Endless crawlable filter combinations that waste crawling", ["Filter widgets that slow down LCP and INP on every category page", "Filtered pages can't be indexed by Google at all", "Google penalizes ecommerce sites that use filters"], "Decide which facets deserve indexable pages. Keep the rest out of crawl paths with robots.txt rules and non-crawlable links, plus canonicals."],
["arch", 2, "How does Google use `rel=\"next\"` and `rel=\"prev\"` for pagination today?", "It doesn't; Google stopped using them years ago", ["As the main signal linking paginated pages together", "To merge every paginated page into page 1", "Only on blogs, to order posts by date"], "Give paginated pages self-referencing canonicals and crawlable links between them."],
["arch", 2, "Should page 2 of a category canonicalize to page 1?", "No, each paginated page should self-canonicalize", ["Yes, so all link signals consolidate on page 1 of the category", "Only when page 2 has fewer than 10 items", "Only on mobile, where pages are shorter"], "Canonicalizing page 2 to page 1 tells Google page 2's unique content (its product links) doesn't matter."],
["arch", 1, "What's 'click depth'?", "How many clicks it takes to reach a page from the homepage", ["How many times users click results before they stay on a page", "How long visitors stay on a page before leaving", "How many outbound links a page contains in total"], "Important pages should be shallow, typically within about 3 clicks. Deep pages get crawled and valued less."],
["arch", 3, "An event calendar has 'next month' links that go on forever. What's this called?", "A crawl trap (an infinite space)", ["A link wheel", "A cloaking pattern (different content for bots)", "A doorway page"], "Crawlers can follow endless generated URLs. Limit the range or make those links non-crawlable."],
["arch", 1, "Why does descriptive internal anchor text matter?", "It tells users and Google what the target page is about", ["It's purely decorative and has no SEO effect", "Longer anchor text reduces layout shift when the menu loads", "Google ignores anchor text on internal links"], "'Technical SEO audit checklist' beats 'click here' for both relevance and accessibility."],
["logs",2,"What two things make up Google's crawl budget?","Crawl capacity limit and crawl demand",["Page count and domain age","Backlinks and bounce rate","Sitemap size and robots.txt size"],"Capacity is how much your server can take without strain. Demand is how much Google wants to crawl, based on popularity and freshness."],
["logs", 2, "Which sites usually need to worry about crawl budget?", "Very large or very fast-changing sites", ["Every site with more than 100 pages", "Only brand-new sites with no history", "Only sites running on shared hosting"], "For most small sites, Google crawls everything it needs. Crawl budget is a large-site problem."],
["logs", 2, "An audit finds 3,000 orphan pages (no internal links) that are only listed in the sitemap. What's the usual fix?", "Link the ones worth keeping, and remove or redirect the rest", ["Leave them, because a sitemap entry is enough", "Noindex the whole site until the orphan pages have been cleaned up", "Add all 3,000 pages to the main navigation menu"], "Pages that only exist in a sitemap tend to get crawled less and rank poorly. Audits are a good time to merge or prune thin orphans."],
["logs", 1, "What can server log analysis tell you that a crawler tool like Screaming Frog can't?", "What bots actually requested, how often, and with which status", ["Where each page ranks for its target keywords, day by day", "How much traffic your competitors are getting", "The monthly search volume for your keywords"], "A site crawler simulates a crawl. Logs show what Googlebot really did."],
["logs",1,"Where is the Crawl Stats report in Search Console?","Settings → Crawl stats",["Performance → Crawl","URL Inspection","Links report"],"It shows requests over time, response codes, file types, host status and Googlebot type."],
["logs", 2, "Does `noindex` save crawl budget?", "Not really, because Google must crawl a page to see noindex", ["Yes, noindexed pages are never crawled again once Google sees the tag", "Yes, it roughly halves how often Google crawls", "Only when it's combined with a nofollow tag"], "To stop crawling, use robots.txt. noindex controls indexing, not crawling, although Google may crawl long-noindexed pages less often."],
["logs", 2, "Which of these wastes the most crawl budget on a large site?", "Endless parameter URLs, redirect chains and soft 404s", ["Having an XML sitemap for every section of the site", "Serving every page over HTTPS instead of HTTP", "Adding self-referencing canonicals to every page"], "Every unnecessary fetch uses crawl capacity that could go to valuable pages."],
["mobile", 1, "Under mobile-first indexing, a block of content exists on desktop but is removed from the mobile HTML. What happens?", "It probably won't be indexed, because Google uses the mobile version", ["It's indexed from the desktop version anyway, because Google merges them", "It ranks only in desktop search results", "Google merges both versions into one record"], "Keep content parity between mobile and desktop."],
["mobile", 2, "Is content inside tabs or accordions on mobile indexed with full weight?", "Yes, content hidden for UX reasons counts normally", ["No, Google ignores content hidden on load", "It counts, but with roughly half the weight", "Only if the tab or accordion is open by default"], "Hiding content in tabs or accordions to save mobile screen space is fine."],
["mobile", 1, "On phones, your site shows the full desktop layout shrunk down, and visitors have to pinch to zoom. What's usually missing?", "A responsive design with a viewport meta tag", ["An XML sitemap listing the mobile pages", "A canonical tag pointing to the desktop page", "Structured data describing the mobile layout"], "Without `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">`, phones render the desktop layout zoomed out. Responsive design is Google's recommended mobile setup."],
["mobile", 1, "Chrome shows 'Not secure' next to your site's address. What's the usual cause?", "The page loads over HTTP, or the certificate has a problem", ["The site doesn't have an XML sitemap", "The page is missing its meta description", "The site has too many internal redirects for Chrome to verify it"], "HTTPS is a small ranking signal and a big trust signal. Check the certificate hasn't expired and that every HTTP URL 301s to HTTPS."],
["mobile", 2, "Are `example.com/page` and `example.com/page/` the same URL to Google?", "No, they're separate URLs (except the root)", ["Yes, Google always treats them as the same page", "Only when the site is served over HTTPS", "Only when the sitemap lists both versions"], "Pick one format, redirect the other, and link consistently."],
["mobile",2,"Are URL paths case-sensitive?","Yes — `/Shoes` and `/shoes` are different URLs",["No, never","Only the domain is","Only on Linux servers, and Google normalizes them"],"Domains are case-insensitive, but paths and parameters are case-sensitive. Normalize to lowercase and redirect."],
["mobile", 1, "What's 'mixed content'?", "An HTTPS page loading resources over HTTP", ["A page whose content mixes two languages", "A page that mixes text, images and video", "The same content published across two domains"], "Browsers block or warn on mixed content. Update every resource URL to HTTPS."],
["mobile", 2, "What does the HSTS header do?", "Tells browsers to always use HTTPS for the domain", ["Speeds up DNS lookups for returning visitors", "Sets the preferred canonical host (www or non-www) for Google", "Blocks known bad bots at the browser level"], "`Strict-Transport-Security` prevents protocol downgrade attacks and skips the HTTP → HTTPS redirect hop for returning visitors."],
["mobile",1,"Which is the most SEO-friendly URL for a product page?","`/mens-running-shoes/nike-pegasus-41`",["`/p?id=83749&cat=12`","`/Mens_Running_Shoes/NIKE-Pegasus-41/`","`/products/item/view/83749/default.aspx?ref=nav`"],"Short, lowercase, readable URLs with hyphens are easiest for people and search engines. Don't change URLs that already rank unless you redirect them."],
["mobile", 2, "Does Google index images set as CSS `background-image` in Google Images?", "No, use `<img>` elements for images you want indexed", ["Yes, exactly the same as `<img>` elements, including their alt text", "Only PNG files, not JPEGs or WebP", "Only if they're listed in an image sitemap"], "Google Images indexes `<img>` src (including srcset). Background images aren't picked up as image content."],
["gsc",2,"How is 'Average position' calculated in the Performance report?","The average of your site's topmost position each time it appeared",["The median of all rankings","The average of every URL's position, including lower ones","Your position on page 1 only"],"If your site appears at positions 3 and 7 for one query, that impression counts as position 3."],
["gsc", 1, "How much historical data does the Performance report keep?", "16 months", ["Forever", "Three years", "5 years"], "Export your data regularly, or use the BigQuery bulk export, if you need a longer history."],
["gsc", 1, "What does a Domain property in Search Console cover that a URL-prefix property doesn't?", "Every protocol and subdomain, verified through DNS", ["Only the homepage and its direct child pages", "Data about competitors' sites in the same niche", "Paid search clicks alongside organic data"], "URL-prefix properties cover a single protocol and host prefix."],
["gsc", 2, "Does clicking 'Request indexing' in URL Inspection guarantee a page gets indexed?", "No, it only asks Google to crawl the page", ["Yes, the page is indexed within an hour", "Yes, and it stays indexed permanently", "Only for pages served over HTTPS"], "Use it for important new or updated pages. It won't override quality or technical issues."],
["ai", 2, "What special markup do you need to appear in Google's AI Overviews?", "None; the page just needs to be indexed and snippet-eligible", ["`AIOverview` schema markup on the pages you want cited", "An llms.txt file in the root of the site", "An explicit `Allow` rule for Google-Extended in robots.txt"], "Google says the usual Search best practices apply. There's no special optimization file or markup."],
["ai", 2, "How can you limit what content Google shows from your page in AI Overviews?", "The usual snippet controls, such as `nosnippet`", ["Disallow Google-Extended in robots.txt for those pages", "List excluded sections in an llms.txt file", "Add a `noai` line to robots.txt"], "Google's AI features in Search follow the same preview controls as regular snippets."],
["ai", 3, "If you block `GPTBot` in robots.txt, are you blocked from ChatGPT search results?", "Not necessarily; ChatGPT search uses `OAI-SearchBot`", ["Yes, GPTBot is the single crawler behind every OpenAI product", "Yes, and Google AI Overviews as well", "Only image results inside ChatGPT"], "AI companies often run separate crawlers for training and for search or retrieval. Check each one's documentation and decide one at a time."],
["ai", 2, "What is llms.txt?", "A proposed file that summarises a site for LLMs", ["An official Google standard required for AI Overviews", "A replacement for robots.txt that AI crawlers obey", "A W3C web standard published in 2024"], "It's an emerging proposal with uneven adoption. Don't expect it to affect Google Search."],
["ai", 3, "Why can heavy client-side rendering hurt visibility in AI assistants and answer engines?", "Many AI crawlers don't run JavaScript, so they miss that content", ["AI crawlers can't parse HTML at all, only plain text and markdown files", "Language models deliberately penalize React sites", "AI crawlers only read XML sitemaps, not pages"], "Server-rendered content is readable by the widest range of bots."],
["crawl", 2, "A dev adds `Disallow: /` under `User-agent: *` on staging, and it ships to production. What's the first symptom you'd expect?", "Results start showing without descriptions, then traffic falls", ["Every page disappears from Google's index within the first hour", "Search Console immediately shows a manual action", "Nothing, because the sitemap overrides robots.txt"], "Already-indexed URLs may linger without snippets. Always check robots.txt after every deploy."],
["index", 3, "A page has two different `rel=canonical` tags. How does Google handle it?", "Google will probably ignore both and pick its own", ["It uses the first canonical tag it finds in the HTML", "It uses the last canonical tag in the HTML", "It indexes both of the canonical URLs"], "Multiple conflicting canonicals cancel each other out. Make sure plugins and templates don't both add one."],
["index", 2, "Where must the robots meta tag go to be reliably honored?", "In the `<head>` of the HTML", ["Anywhere in the `<body>` of the page", "In the page footer", "In the XML sitemap"], "If invalid elements break the head early (for example an injected `<img>` or `<div>`), the browser parser may end the head and the robots tag may be missed."],
["status", 3, "What's the main drawback of a JavaScript redirect compared with a server-side 301?", "Google only sees it after rendering, and other crawlers may not", ["Google can't follow JavaScript redirects at all, so signals are lost", "It passes negative PageRank to the target", "It always creates a soft 404 on the old URL"], "Use server-side redirects whenever you can. Use JS redirects only when you have no server access."],
["cwv", 2, "How can you make the LCP image load sooner?", "Put it in the initial HTML and give it high fetch priority", ["Lazy-load it so other content loads first", "Inject it with JavaScript after the onload event so it doesn't block", "Turn it into a CSS background image instead"], "The browser should discover the LCP resource as early as possible and treat it as a priority."],
["schema", 3, "You mark up a product with `offers.price` that differs from the price shown on the page. What's the likely outcome?", "The markup may be ignored, and it can trigger a manual action", ["Google shows the price from the markup instead of the one on the page", "Nothing, because Google ignores price in markup", "Click-through rate improves if the price is lower"], "Structured data must match the visible content. Merchant Center mismatches can also get products disapproved."],
["intl", 1, "You have the same English page for the US and the UK, with different prices. What tells Google which version to show in each country?", "hreflang `en-US` and `en-GB` tags on both pages", ["A canonical tag from the UK page to the US page", "Translating the UK page into another language", "Merging both versions onto a single URL"], "hreflang helps Google show the right regional version. Each page should list itself and every alternate."],
["arch", 3, "Breadcrumb navigation mainly helps technical SEO by:", "Adding hierarchical internal links that clarify site structure", ["Removing the need for an XML sitemap, because every page is linked", "Improving INP by reducing clicks needed to navigate", "Stopping duplicate content across category pages"], "Breadcrumbs link each page up to its parent categories, which spreads link equity through the hierarchy."],
["sitemap",1,"Where in Search Console can you see whether your sitemap was read and how many pages it found?","Indexing → Sitemaps",["Performance → Search results","Links","Settings → Users and permissions"],"The Sitemaps report shows status, last read date and discovered pages. Click through to see indexing for just that sitemap's URLs."],
["logs", 3, "Log files show Googlebot hitting thousands of `?sort=price&color=red&size=9` URLs. What's the best first fix?", "Stop crawlable links to them and disallow the low-value patterns", ["Add noindex to every parameter combination", "Delete the XML sitemap so Google stops discovering the parameter URLs", "Return 500 errors for any URL with parameters"], "noindex still requires crawling. robots.txt and link hygiene cut the crawl waste at the source."],
["crawl", 3, "Google's large-site crawler docs: what can trap an important page in 'Discovered – currently not indexed' for months?", "Masses of low-value URLs, such as facets, using up crawling", ["Too few backlinks pointing at the homepage", "Using JSON-LD rather than microdata for the page's structured data", "Serving the site over HTTP/2 instead of HTTP/1.1"], "When Googlebot spends its crawl capacity on junk URLs, discovered pages wait in the queue. Clean up crawl paths so it reaches what matters."],

["news",2,"In April 2026, Google added 'back button hijacking' to its spam policies. Which policy category does it fall under?","Malicious practices — with enforcement from June 15, 2026",["Site reputation abuse","Scaled content abuse","Link spam"],"Google classed manipulating browser history to trap users as a malicious practice, with manual actions or automated demotions as penalties. Third-party ad scripts and libraries can be the cause, so audit them too."],
["news",2,"Google's 2026 docs say Googlebot only reads the first 2 MB of a page's HTML. Who does this actually affect?","Very few sites — only pages with enormous HTML, such as huge inline scripts or data",["Every site — most pages are over 2 MB","Image-heavy pages, because images count toward the limit","Only sites on slow hosting"],"Images, CSS and JS are fetched separately and don't count toward it. For almost every normal page, this is nothing to worry about."],
["news",1,"In March 2026, Google moved the files that list its crawler IP addresses. Who usually needs to act?","Your developer or hosting team, if they run firewall or bot-blocking rules that use those files",["Every site owner must resubmit their sitemap","Content writers must update their pages","Nobody — Google deleted the files"],"Most SEOs don't need to do anything. If your site uses custom bot checks, let the devs know so the real Googlebot doesn't get blocked."],
["news",2,"In October 2026, Google, OpenAI, Anthropic and Microsoft backed a shared robots.txt token for opting out of AI training. What is it?","`__usage_ai-training`",["`Google-Extended`","`noai`","`GPTBot`"],"It comes from an IETF AI Preferences draft. Google said it aims to support it in 2027, and Google-Extended keeps working in the meantime. Blocking AI training doesn't stop Googlebot from indexing you for Search."],
["news",2,"What does the generative AI control that Google added to Search Console in 2026 do?","Lets a site opt out of appearing in, and grounding, AI Overviews, AI Mode and Discover's AI features. Google says it isn't a ranking signal for regular results",["It blocks Google from training Gemini on your content","It removes the site from Google Search entirely","It turns off AI Overviews for everyone searching your brand"],"It's a presentation control for Search's generative features, not a training control. Sites that opt out get no traffic or impressions from those features."],
["news",1,"What was unusual about Google's February 2026 core update?","It was the first core update Google publicly labeled as Discover-only",["It was the first update targeting AI-written content","Google rolled it back after a week","It only affected EU countries"],"Google's 2026 run of updates included the February Discover core update, a March spam update, a March core update and a May core update."],
["news",2,"In November 2026, Gary Illyes explained what can happen when a very important URL suddenly starts returning a 4xx. What did he say?","Google Search may temporarily protect it from dropping out of the index right away",["It's removed from the index within the hour","Google shows the 4xx error page in results","It triggers an automatic manual review"],"His example was VLC's site serving a 418 status. Normally 4xx means 'not found', but Google can briefly hold on to very important URLs. Don't count on that for your own pages."],
["news",1,"What do Search Console's platform properties, rolled out globally in 2026, let you see?","How your content on platforms such as YouTube, Instagram, TikTok and X performs in Google Search",["Your social media ad spend","Backlinks from social networks","Competitors' social traffic"],"Platform properties bring Search performance data for your third-party channel content into Search Console."],
["news",1,"Which manual workaround does Search Console's branded queries filter replace?","Writing your own regex filters to separate brand queries from non-brand queries",["Exporting data to Google Analytics","Buying brand keywords in Google Ads","Submitting brand names through the Disavow tool"],"Google now classifies branded queries automatically, so you can track non-brand SEO growth without maintaining a regex."],
["news",2,"Which image format did Google confirm in October 2026 is NOT supported by Google Images or Discover?","JPEG XL",["WebP","AVIF","SVG"],"WebP, AVIF and SVG are all supported in Google Images. If you serve JPEG XL, provide a fallback format through `<picture>` or content negotiation."],
["news",2,"Where can you see how your pages perform in Google's AI Overviews and AI Mode?","Search Console's Search Generative AI performance reports",["Only in Google Analytics","Nowhere — Google doesn't report it","In Merchant Center"],"Google launched dedicated generative AI performance reports in Search Console in 2026 and later rolled them out to all sites."],
["news",2,"You spot `Google-Agent` in a bot traffic report. According to Google's March 2026 docs, what is it?","A visit made by Google's AI agent on behalf of a person, not regular Search crawling",["Googlebot indexing your site for Search","A fake bot — Google has no crawler by that name","Google Ads checking your landing pages"],"It's separate from Googlebot, so it tells you nothing about indexing. It's just useful for explaining new traffic in bot reports."],
["news",2,"Since August 30, 2026, what happens to a site reputation abuse manual action for searchers inside the European Economic Area (EEA)?","It no longer affects results shown to EEA users, though it still applies outside the EEA",["It applies worldwide, including the EEA, with no change","It now demotes the whole site in the EEA, not just the violating section","The policy was retired everywhere"],"Google changed this after talks with the European Commission and in November 2026 began emailing affected sites through Search Console. If you work with EU and non-EU markets, parasite-style sections can rank differently by region, so check rankings per market before assuming a penalty is gone."],
["news",1,"What did Search Console's Performance report add in November 2026, a month after multi-select country filters?","Multi-select device filters, so you can combine Desktop, Mobile and Tablet in one view",["A Core Web Vitals column for each query","Hourly data going back 16 months","Competitor click data for shared queries"],"You no longer need separate views or exports to compare or group device types. Try combining Mobile and Tablet to see total small-screen performance."],
["news",1,"Google's Gary Illyes said in October 2026 that fake 'Googlebot' traffic is growing. What's the safest way to handle it?","Let your CDN or firewall verify the real Googlebot, rather than blocking anything that calls itself Googlebot",["Block every request that says Googlebot","Add `Disallow: /` for Googlebot in robots.txt","Ignore it — fake bots can't affect your site"],"Fake bots scrape content and load your server. But blocking by name alone risks blocking the real Googlebot and dropping out of Search."],
